# Production compose file for the VPS. CI builds api/web/admin images, pushes them to GHCR
# tagged by commit SHA, and the deploy step writes that SHA into IMAGE_TAG in /opt/gul/.env
# before `docker compose pull && up -d` (see .github/workflows/deploy.yml) — immutable tags mean
# a previous deploy is always addressable for rollback, which the deploy step does automatically
# if the new tag fails its health check. Real secrets live only in /opt/gul/.env on the server
# (never committed).
#
# Every service below gets the same log cap: 10MB per file, 5 files kept (50MB/service ceiling).
# Added 2026-08-28 after primary hit 98% disk — the actual cause that night was accumulated
# unused docker images (see deploy.yml's prune step), not container logs, but there was no cap on
# log growth either (confirmed: no /etc/docker/daemon.json existed anywhere, so the json-file
# driver's default is unbounded). Doing it here instead of a host-level daemon.json on purpose:
# this applies on the next normal `docker compose up -d` a deploy already does, with no separate
# docker-daemon restart (and therefore no extra container-restart event) needed to take effect.
x-logging: &default-logging
  # journald instead of json-file: makes container logs show up in Netdata's built-in systemd
  # journal viewer alongside Postfix/nginx/OpenDKIM logs, no separate log-shipping tool needed.
  # Retention is bounded by journald.conf's SystemMaxUse (set via setup-netdata-secondary-streaming.yml),
  # not per-container here -- journald has no per-container size cap option.
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  # Not the database itself any more: HAProxy, which hands every connection to whichever node
  # Patroni reports as leader (GET :8008/primary on each). The database is the gul-pg container
  # (Patroni + Postgres, host network, outside this file) on both nodes -- see
  # migrate-to-patroni.yml and infra/patroni/. Keeping the service name "postgres" is what lets
  # DATABASE_URL stay @postgres:5432 on both nodes through any failover. haproxy-pg.cfg is
  # written by migrate-to-patroni.yml (it holds only the two node addresses).
  postgres:
    image: haproxy:3.0-alpine
    restart: unless-stopped
    volumes:
      - ./haproxy-pg.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    logging: *default-logging

  # Not Redis itself any more: HAProxy to whichever node's redis reports role:master. Redis is the
  # gul-redis container on both nodes (host network, outside this file), replicated, with three
  # Sentinels (primary, secondary, witness) deciding the master -- see migrate-redis-ha.yml.
  # The name stays "redis" so REDIS_URL is @redis:6379 through any failover. haproxy-redis.cfg is
  # built on the node from its own .env (it carries the password for the health check).
  redis:
    image: haproxy:3.0-alpine
    restart: unless-stopped
    volumes:
      - ./haproxy-redis.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    logging: *default-logging

  # ADR 0008: two HTTP processes (api, api-2) behind nginx's least_conn upstream, plus one
  # background worker (api-worker: BullMQ, sweepers, crons, Telegram polling). One Node process is
  # one event loop, and these boxes have 6 cores. Each process opens at most 6 database connections
  # (PRISMA_CONNECTION_LIMIT), so 18 per node and 36 for both -- Prisma's default would be 13 each.
  # The worker's port only serves health checks and is never in the nginx upstream.
  api: &api-service
    image: ghcr.io/${GHCR_OWNER}/gul-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment: &api-env
      # Set here rather than in .env so that the password arriving and the client starting to use
      # it are the same `docker compose up`. Split across the two, there is a window where redis
      # demands a password the API is not sending, or the reverse -- and in that window nothing
      # can be queued on either node.
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      # Which server and process this is on the admin Performance page.
      NODE_LABEL: "primary-http-1"
      APP_ROLE: "http"
      PRISMA_CONNECTION_LIMIT: "6"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      # Matches UPLOADS_DIR's default (./uploads resolved against the api container's
      # cwd, /repo/apps/api) — set UPLOADS_DIR in /opt/gul/.env only if that ever changes.
      - uploads-data:/repo/apps/api/uploads
    logging: *default-logging

  api-2:
    <<: *api-service
    environment:
      <<: *api-env
      NODE_LABEL: "primary-http-2"
    ports:
      - "127.0.0.1:4002:4000"

  api-worker:
    <<: *api-service
    environment:
      <<: *api-env
      NODE_LABEL: "primary-worker"
      APP_ROLE: "worker"
    ports:
      - "127.0.0.1:4001:4000"

  web:
    image: ghcr.io/${GHCR_OWNER}/gul-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
    logging: *default-logging

  admin:
    image: ghcr.io/${GHCR_OWNER}/gul-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8081:80"
    logging: *default-logging

volumes:
  # Still the primary's data: gul-pg mounts it by name (gul_postgres-data). Nothing here uses it
  # any more, and it must never be removed (`docker compose down -v`).
  postgres-data:
  # Still the primary's queue data: gul-redis mounts it by name (gul_redis-data). Never remove it.
  redis-data:
  uploads-data:
