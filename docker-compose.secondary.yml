# Compose for the secondary VPS: the app containers plus HAProxy as "postgres". The database is
# the gul-pg container (Patroni, host network, outside this file) -- see migrate-to-patroni.yml.
# HAProxy routes to whichever node is the Patroni leader, so DATABASE_URL is @postgres:5432 here
# exactly as on the primary. Redis likewise: service
# "redis" is HAProxy to the current master (migrate-redis-ha.yml).
#
# Same log cap as docker-compose.prod.yml (10MB x 5 files/service) -- see that file for why.
x-logging: &default-logging
  # journald instead of json-file: makes container logs show up in Netdata's built-in systemd
  # journal viewer alongside Postfix/nginx/OpenDKIM logs, no separate log-shipping tool needed.
  # Retention is bounded by journald.conf's SystemMaxUse (set via setup-netdata-secondary-streaming.yml),
  # not per-container here -- journald has no per-container size cap option.
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  # HAProxy to whichever node's redis is master -- same as docker-compose.prod.yml's redis service.
  redis:
    image: haproxy:3.0-alpine
    restart: unless-stopped
    volumes:
      - ./haproxy-redis.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks: [gul-net]
    logging: *default-logging

  # HAProxy to the current Patroni leader -- same as docker-compose.prod.yml's postgres service.
  postgres:
    image: haproxy:3.0-alpine
    restart: unless-stopped
    volumes:
      - ./haproxy-pg.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks: [gul-net]
    logging: *default-logging

  # ADR 0008: two HTTP processes (api, api-2) behind nginx's least_conn upstream, plus one
  # background worker (api-worker: BullMQ, sweepers, crons, Telegram polling). One Node process is
  # one event loop, and these boxes have 6 cores. Each process opens at most 6 database connections
  # (PRISMA_CONNECTION_LIMIT), so 18 per node and 36 for both -- Prisma's default would be 13 each.
  # The worker's port only serves health checks and is never in the nginx upstream.
  api: &api-service
    image: ghcr.io/${GHCR_OWNER}/gul-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment: &api-env
      # The local router (service "redis" above) finds the master; same URL as the primary's.
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      # Which server and process this is on the admin Performance page.
      NODE_LABEL: "secondary-http-1"
      APP_ROLE: "http"
      PRISMA_CONNECTION_LIMIT: "6"
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - uploads-data:/repo/apps/api/uploads
    networks: [gul-net]
    logging: *default-logging

  api-2:
    <<: *api-service
    environment:
      <<: *api-env
      NODE_LABEL: "secondary-http-2"
    ports:
      - "127.0.0.1:4002:4000"

  api-worker:
    <<: *api-service
    environment:
      <<: *api-env
      NODE_LABEL: "secondary-worker"
      APP_ROLE: "worker"
    ports:
      - "127.0.0.1:4001:4000"

  web:
    image: ghcr.io/${GHCR_OWNER}/gul-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
    networks: [gul-net]
    logging: *default-logging

  admin:
    image: ghcr.io/${GHCR_OWNER}/gul-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8081:80"
    networks: [gul-net]
    logging: *default-logging

networks:
  gul-net:
    external: true

volumes:
  redis-data:
  uploads-data:
