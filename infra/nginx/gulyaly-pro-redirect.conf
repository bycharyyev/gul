# gulyaly.pro -- the domain the site lived on before the move to gulyaly.com (2026-09-18).
# Still registered and on Timeweb NS, so old links, bookmarks, search results and old app
# builds keep arriving here. Everything is sent to the same path on gulyaly.com; nothing is
# served from this name, so cookies, CORS and sessions stay on one domain.
#
# api.gulyaly.pro answers 308, not 301: a 301 lets a client turn a POST into a GET, and an old
# app build calling the API on this name would then lose its request body.
#
# The certificate is the shared one at /etc/ssl/gulyaly/: renew-certs.yml issues it for
# gulyaly.com, *.gulyaly.com, gulyaly.pro and *.gulyaly.pro.

map $host $gulyaly_pro_target {
    default             https://gulyaly.com;
    api.gulyaly.pro     https://api.gulyaly.com;
    admin.gulyaly.pro   https://admin.gulyaly.com;
}

server {
    listen 80;
    listen [::]:80;
    server_name gulyaly.pro *.gulyaly.pro;
    server_tokens off;

    location / {
        if ($host = api.gulyaly.pro) {
            return 308 $gulyaly_pro_target$request_uri;
        }
        return 301 $gulyaly_pro_target$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gulyaly.pro *.gulyaly.pro;
    server_tokens off;

    ssl_certificate /etc/ssl/gulyaly/fullchain.pem;
    ssl_certificate_key /etc/ssl/gulyaly/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        if ($host = api.gulyaly.pro) {
            return 308 $gulyaly_pro_target$request_uri;
        }
        return 301 $gulyaly_pro_target$request_uri;
    }
}
