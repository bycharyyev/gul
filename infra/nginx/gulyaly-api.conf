# ADR 0008: two HTTP API processes per node (api on 4000, api-2 on 4002). least_conn sends each
# request to the less busy one, and if one is down (being replaced during a rolling deploy) the
# connection error makes nginx try the other. nginx never retries a request it has already sent
# when the method is not idempotent, so a POST (an order, a payment, a webhook) cannot be
# replayed on the second process. The worker process (4001) is deliberately not listed.
upstream gul_api {
    least_conn;
    server 127.0.0.1:4000 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:4002 max_fails=1 fail_timeout=5s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.gulyaly.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.gulyaly.com;

    # Wildcard gulyaly.com + *.gulyaly.com, issued by .github/workflows/renew-certs.yml (DNS-01) and
    # installed identically on both hosts -- see infra/ssl/README.md. Not certbot-managed on the host.
    ssl_certificate /etc/ssl/gulyaly/fullchain.pem;
    ssl_certificate_key /etc/ssl/gulyaly/privkey.pem;
    ssl_session_cache shared:le_nginx_SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";

    include /etc/nginx/snippets/gul/api-site.inc;
}
