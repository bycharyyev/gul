server {
    listen 80;
    listen [::]:80;
    server_name gulyaly.com www.gulyaly.com;

    # Must stay reachable over plain HTTP: this is how Let's Encrypt validates the domain
    # on renewal (webroot challenge). Everything else redirects to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gulyaly.com www.gulyaly.com;

    # Wildcard gulyaly.com + *.gulyaly.com, issued by .github/workflows/renew-certs.yml (DNS-01) and
    # installed identically on both hosts -- see infra/ssl/README.md. Not certbot-managed on the host.
    ssl_certificate /etc/ssl/gulyaly/fullchain.pem;
    ssl_certificate_key /etc/ssl/gulyaly/privkey.pem;
    ssl_session_cache shared:le_nginx_SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";

    include /etc/nginx/snippets/gul/web-site.inc;

    # One canonical host. Google listed www.gulyaly.com/ as a duplicate of the apex (Search Console
    # "Alternate page with proper canonical tag"); a permanent redirect consolidates the two.
    if ($host = www.gulyaly.com) {
        return 301 https://gulyaly.com$request_uri;
    }
}
