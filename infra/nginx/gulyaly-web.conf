server {
    listen 80;
    listen [::]:80;
    server_name gulyaly.pro www.gulyaly.pro;

    # Must stay reachable over plain HTTP: this is how Let's Encrypt validates the domain
    # on renewal (webroot challenge). Everything else redirects to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gulyaly.pro www.gulyaly.pro;

    ssl_certificate /etc/letsencrypt/live/gulyaly.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gulyaly.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
