# Shared proxy cache zone. Lives in its own file because `proxy_cache_path` belongs to the http
# block and may appear exactly once -- putting it inside one of the vhosts would work until the
# day a second vhost wanted to cache too, and then nginx would refuse to start.
#
# sites-enabled is included from inside http{}, so this file is in the right scope as it stands.
#
# 64m of disk and 10m of keys is far more than the handful of public endpoints below can fill; the
# point is not capacity, it is that a burst of identical requests reaches Postgres once instead of
# a thousand times. inactive=10m evicts anything nobody has asked for in ten minutes, so the cache
# stays small and warm rather than large and stale.
proxy_cache_path /var/cache/nginx/gul
                 levels=1:2
                 keys_zone=gul_api:10m
                 max_size=64m
                 inactive=10m
                 use_temp_path=off;
