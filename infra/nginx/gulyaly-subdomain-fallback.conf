# Catches any *.gulyaly.pro hostname that isn't one of our real vhosts (gulyaly.pro, www.,
# admin., api., or a currently-managed subdomain from the admin Subdomains tab) -- e.g. a typo
# or a subdomain that was since removed. Shows a branded page and bounces to the main storefront
# instead of a bare nginx 404. `default_server` makes this the fallback for any unmatched Host
# header on these ports; it must stay the only vhost using that flag on each port.
#
# Caveat: only gulyaly.pro/www./admin./api. (and managed subdomains) have a matching TLS
# certificate. A mistyped subdomain still resolves here via the DNS wildcard, but the browser
# will show a certificate-name-mismatch warning before this page, since there's no wildcard cert
# -- getting one would need DNS-01 validation (API access at the DNS host, which we don't have
# automated). Fine over plain HTTP and for anyone who clicks through the HTTPS warning.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "<!DOCTYPE html>
<html lang=\"ru\">
<head>
<meta charset=\"utf-8\">
<title>Gulyaly</title>
<meta http-equiv=\"refresh\" content=\"5;url=https://gulyaly.pro/\">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ede9fe,#ecfeff);font-family:system-ui,sans-serif}
.card{background:#fff;border-radius:20px;padding:48px 40px;text-align:center;box-shadow:0 20px 60px rgba(79,70,229,.15);max-width:420px}
.logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#0ea5e9);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;margin:0 auto 20px}
h1{font-size:20px;margin:0 0 10px;color:#1e1b4b}
p{color:#64748b;font-size:15px;line-height:1.5;margin:0 0 24px}
a{display:inline-block;background:linear-gradient(135deg,#7c3aed,#0ea5e9);color:#fff;padding:12px 28px;border-radius:12px;text-decoration:none;font-weight:600}
#n{font-weight:700;color:#7c3aed}
</style>
</head>
<body>
<div class=\"card\">
<div class=\"logo\">Gu</div>
<h1>Такого магазина не существует</h1>
<p>Проверьте адрес — через <span id=\"n\">5</span> сек. перенесём вас на главную страницу Gulyaly.</p>
<a href=\"https://gulyaly.pro/\">Перейти сейчас</a>
</div>
<script>
var n=5,t=document.getElementById('n');
setInterval(function(){n--;if(n>=0)t.textContent=n;if(n<=0)location.href='https://gulyaly.pro/';},1000);
</script>
</body>
</html>
";
        add_header Content-Type text/html;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/gulyaly.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gulyaly.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 200 "<!DOCTYPE html>
<html lang=\"ru\">
<head>
<meta charset=\"utf-8\">
