<p>Проверьте адрес — через <span id=\"n\">5</span> сек. перенесём вас на главную страницу Gulyaly.</p>
<a href=\"https://gulyaly.pro/\">Перейти сейчас</a>
</div>
<script>
var n=5,t=document.getElementById('n');
setInterval(function(){n--;if(n>=0)t.textContent=n;if(n<=0)location.href='https://gulyaly.pro/';},1000);
</script>
</body>
</html>
";
        add_header Content-Type text/html;
    }
