server {
    listen 80;
    listen [::]:80;
    server_name admin.gulyaly.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.gulyaly.com;

    # Wildcard gulyaly.com + *.gulyaly.com, issued by .github/workflows/renew-certs.yml (DNS-01) and
    # installed identically on both hosts -- see infra/ssl/README.md. Not certbot-managed on the host.
    ssl_certificate /etc/ssl/gulyaly/fullchain.pem;
    ssl_certificate_key /etc/ssl/gulyaly/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    # Security headers (S-03 in docs/analysis/SECURITY.md). The staff console is never meant to be
    # framed (clickjacking) or to leak its URLs as a referrer. `always` so error pages carry them.
    # nginx drops every server-level add_header in a location that declares its own -- which is
    # why `location = /index.html` below repeats this block. Keep the two copies identical.
    # The CSP is report-only until its reports in Sentry show nothing legitimate is blocked.
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; connect-src 'self' https://api.gulyaly.com wss://api.gulyaly.com https://*.ingest.de.sentry.io; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; report-uri https://o4512085236318208.ingest.de.sentry.io/api/4512085921628240/security/?sentry_key=1127fec1696b085767b9ffe997cfa202" always;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The single-page shell must be revalidated on every load. Its assets are content-hashed and
    # safely cacheable forever, but index.html is what names them: a browser holding an old copy
    # keeps loading yesterday's bundle and simply never sees a new section, with nothing on screen
    # to suggest why. Served without Cache-Control it falls to heuristic caching, which is exactly
    # the ambiguity to remove here.
    location = /index.html {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache" always;
        # Repeated from the server block: this location's own add_header cancels inheritance.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; connect-src 'self' https://api.gulyaly.com wss://api.gulyaly.com https://*.ingest.de.sentry.io; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; report-uri https://o4512085236318208.ingest.de.sentry.io/api/4512085921628240/security/?sentry_key=1127fec1696b085767b9ffe997cfa202" always;
    }

    # netdata-gate (systemd unit, /opt/netdata-gate/) issues a signed cookie on successful
    # login; /netdata-check validates that cookie on every /netdata/ request via auth_request
    # before nginx proxies through to netdata itself on 19999 -- netdata has no auth of its own.
    location = /netdata-check {
        internal;
        proxy_pass http://127.0.0.1:8899/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location /netdata-login {
        proxy_pass http://127.0.0.1:8899;
        proxy_set_header Host $host;
    }

    location /netdata/ {
        # Same-origin framing only: the admin Monitoring page embeds this dashboard in an iframe. A location
        # with its own add_header drops every server-level one, so the full set is repeated here.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; connect-src 'self' https://api.gulyaly.com wss://api.gulyaly.com https://*.ingest.de.sentry.io; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; report-uri https://o4512085236318208.ingest.de.sentry.io/api/4512085921628240/security/?sentry_key=1127fec1696b085767b9ffe997cfa202" always;
        auth_request /netdata-check;
        error_page 401 = @netdata_login_redirect;
        proxy_pass http://127.0.0.1:19999/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @netdata_login_redirect {
        return 302 /netdata-login;
    }
}
