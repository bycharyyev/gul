server {
    listen 80;
    listen [::]:80;
    server_name admin.gulyaly.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.gulyaly.pro;

    ssl_certificate /etc/letsencrypt/live/gulyaly.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gulyaly.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The single-page shell must be revalidated on every load. Its assets are content-hashed and
    # safely cacheable forever, but index.html is what names them: a browser holding an old copy
    # keeps loading yesterday's bundle and simply never sees a new section, with nothing on screen
    # to suggest why. Served without Cache-Control it falls to heuristic caching, which is exactly
    # the ambiguity to remove here.
    location = /index.html {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache" always;
    }

    # netdata-gate (systemd unit, /opt/netdata-gate/) issues a signed cookie on successful
    # login; /netdata-check validates that cookie on every /netdata/ request via auth_request
    # before nginx proxies through to netdata itself on 19999 -- netdata has no auth of its own.
    location = /netdata-check {
        internal;
        proxy_pass http://127.0.0.1:8899/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location /netdata-login {
        proxy_pass http://127.0.0.1:8899;
        proxy_set_header Host $host;
    }

    location /netdata/ {
        auth_request /netdata-check;
        error_page 401 = @netdata_login_redirect;
        proxy_pass http://127.0.0.1:19999/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @netdata_login_redirect {
        return 302 /netdata-login;
    }
}
