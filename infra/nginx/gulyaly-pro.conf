# gulyaly.pro: the second domain, serving the same storefront and API as gulyaly.com -- no redirect
# (2026-11-18). It exists so a payment provider can be connected to a domain of its own while
# orders, accounts and the database stay one system: both domains reach the same containers.
#
# Its own certificate (gulyaly.pro + *.gulyaly.pro, /etc/ssl/gulyaly-pro/), issued by
# renew-certs.yml next to the gulyaly.com one. The site and API bodies are the shared snippets in
# infra/nginx/snippets/, so the two domains cannot drift apart.
#
# The storefront bundle calls https://api.gulyaly.com (NEXT_PUBLIC_API_URL is baked at build), so
# https://gulyaly.pro must be in the API's CORS_ORIGINS (set-cors-origins.yml). Pages declare
# gulyaly.com as canonical, so search engines see one site, not two.
#
# Not served here: the admin console (staff use admin.gulyaly.com, behind its own login gate) and
# any other *.gulyaly.pro name, which goes to the storefront.

server {
    listen 80;
    listen [::]:80;
    server_name gulyaly.pro *.gulyaly.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gulyaly.pro www.gulyaly.pro;

    ssl_certificate /etc/ssl/gulyaly-pro/fullchain.pem;
    ssl_certificate_key /etc/ssl/gulyaly-pro/privkey.pem;
    ssl_session_cache shared:le_nginx_SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";

    include /etc/nginx/snippets/gul/web-site.inc;

    if ($host = www.gulyaly.pro) {
        return 301 https://gulyaly.pro$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.gulyaly.pro;

    ssl_certificate /etc/ssl/gulyaly-pro/fullchain.pem;
    ssl_certificate_key /etc/ssl/gulyaly-pro/privkey.pem;
    ssl_session_cache shared:le_nginx_SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";

    include /etc/nginx/snippets/gul/api-site.inc;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name *.gulyaly.pro;

    ssl_certificate /etc/ssl/gulyaly-pro/fullchain.pem;
    ssl_certificate_key /etc/ssl/gulyaly-pro/privkey.pem;
    ssl_session_cache shared:le_nginx_SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";
    server_tokens off;

    location / {
        if ($host = admin.gulyaly.pro) {
            return 301 https://admin.gulyaly.com$request_uri;
        }
        return 301 https://gulyaly.pro$request_uri;
    }
}
