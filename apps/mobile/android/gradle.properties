# Flutter's template ships -Xmx8G -XX:MaxMetaspaceSize=4G. On an ordinary development machine
# that is more than the JVM can actually reserve, and R8 -- which only runs for release builds --
# crashes the Gradle daemon outright with "insufficient memory ... mmap failed to map 2.8 GB for
# G1 virtual space". A debug build never gets far enough to notice.
#
# 3 GB heap builds this project's release comfortably and leaves room for the OS, the Dart AOT
# compiler and a typical 7 GB CI runner.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
