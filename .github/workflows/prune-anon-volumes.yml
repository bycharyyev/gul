name: Remove unattached anonymous volumes on the primary (one-off)

# One-off, approved in chat 2026-10-09: anonymous Docker volumes left over from earlier container runs
# on the primary. Removes only volumes that no container (running or stopped) uses; named volumes and
# anything attached are never touched. Deleted by the follow-up commit after it has run.

on:
  workflow_dispatch: {}

jobs:
  prune:
    runs-on: ubuntu-latest
    env:
      PA: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Remove unattached anonymous volumes
        shell: bash {0}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/k && chmod 600 ~/.ssh/k
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf '%s\n' \
            'set -e' \
            'for v in $(docker volume ls -q); do' \
            '  case "$v" in [0-9a-f]*) ;; *) echo "keep named $v"; continue ;; esac' \
            '  users=$(docker ps -a --filter "volume=$v" --format "{{.Names}}")' \
            '  if [ -n "$users" ]; then echo "keep $v (used by $users)"; continue; fi' \
            '  docker volume rm "$v" >/dev/null && echo "removed anonymous $v"' \
            'done' \
            'docker system df' > pv.sh
          scp -q -i ~/.ssh/k pv.sh "$PA:/tmp/pv.sh"
          ssh -i ~/.ssh/k -o BatchMode=yes "$PA" "sh /tmp/pv.sh; rm -f /tmp/pv.sh" < /dev/null
