name: Rename a payment method (WRITES)

# One-off. PaymentMethod.name is what the customer reads in the top-up form, and the seeded row
# still said "Bank card / SBP (demo)" in production -- on a screen where nobody can pay by card at
# all, because the only provider is `manual` and a human confirms the transfer. A customer reading
# "Bank card" expects a card form; a Play reviewer reading "(demo)" sees a store listing whose
# screenshots advertise a demo.
#
# There is no admin page for payment methods (catalog.service.ts exposes listPaymentMethods and no
# mutation), which is why this is a workflow and not two clicks. The real fix is that page; when it
# exists, delete this file.

on:
  workflow_dispatch:
    inputs:
      code:
        description: PaymentMethod.code to rename
        default: "MANUAL"
      name:
        description: The name the customer will read
        default: "Перевод по реквизитам"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject anything that would not survive being quoted into SQL
        # Both values are interpolated into the statement below. A single quote would end the
        # literal early, so the run stops here rather than sending it.
        env:
          CODE: ${{ inputs.code }}
          NAME: ${{ inputs.name }}
        run: |
          case "$CODE" in ''|*[!A-Z0-9_]*) echo "code must be A-Z0-9_: $CODE" >&2; exit 1 ;; esac
          case "$NAME" in ''|*"'"*|*\\*) echo "name is empty or carries a quote/backslash" >&2; exit 1 ;; esac
          echo "ok: $CODE -> $NAME"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Apply, and show before and after
        env:
          CODE: ${{ inputs.code }}
          NAME: ${{ inputs.name }}
        run: |
          cat > /tmp/apply.sql <<SQL
          \echo '=== before ==='
          SELECT code, name, provider, "isEnabled", "feePercent" FROM "PaymentMethod" ORDER BY "sortOrder";

          UPDATE "PaymentMethod" SET name = '$NAME' WHERE code = '$CODE';

          \echo '=== after ==='
          SELECT code, name, provider, "isEnabled", "feePercent" FROM "PaymentMethod" ORDER BY "sortOrder";
          SQL
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'cd /opt/gul && docker compose exec -T postgres sh -c "psql -X -v ON_ERROR_STOP=1 -U \"\$POSTGRES_USER\" \"\$POSTGRES_DB\""' \
            < /tmp/apply.sql
