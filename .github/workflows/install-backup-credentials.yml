name: Install backup credentials

# Writes the four BACKUP_S3_* values (stored as repo secrets) into /opt/gul/.env on the primary,
# without ever printing them to the workflow log. Run it after changing any of those secrets, then
# run "Install DB backups to S3". Kept rather than deleted after first use: it only ever writes
# these four fixed keys, and rotating the bucket key needs it again (infra/backups/README.md).
#
# Values travel as step `env:` (never interpolated into `${{ }}` inside the run script, which
# would risk shell/expression injection) and are written to a file, never echoed.

on:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Require the four secrets to be set
        env:
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          set -e
          for key in BACKUP_S3_ENDPOINT BACKUP_S3_ACCESS_KEY_ID BACKUP_S3_SECRET_ACCESS_KEY BACKUP_S3_BUCKET; do
            value="${!key}"
            if [ -z "$value" ]; then
              echo "missing repo secret: $key -- run: gh secret set $key" >&2
              exit 1
            fi
          done
          echo "all four secrets are present (values not shown)"

      - name: Write the values into /opt/gul/.env
        env:
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          set -e
          TARGET="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          FRAGMENT="$(mktemp)"
          {
            printf 'BACKUP_S3_ENDPOINT=%s\n' "$BACKUP_S3_ENDPOINT"
            printf 'BACKUP_S3_ACCESS_KEY_ID=%s\n' "$BACKUP_S3_ACCESS_KEY_ID"
            printf 'BACKUP_S3_SECRET_ACCESS_KEY=%s\n' "$BACKUP_S3_SECRET_ACCESS_KEY"
            printf 'BACKUP_S3_BUCKET=%s\n' "$BACKUP_S3_BUCKET"
          } > "$FRAGMENT"
          scp -i ~/.ssh/deploy_key "$FRAGMENT" "$TARGET:/tmp/backup-env-fragment"
          rm -f "$FRAGMENT"
          ssh -i ~/.ssh/deploy_key "$TARGET" '
            set -e
            touch /opt/gul/.env
            for key in BACKUP_S3_ENDPOINT BACKUP_S3_ACCESS_KEY_ID BACKUP_S3_SECRET_ACCESS_KEY BACKUP_S3_BUCKET; do
              sed -i "/^${key}=/d" /opt/gul/.env
            done
            cat /tmp/backup-env-fragment >> /opt/gul/.env
            rm -f /tmp/backup-env-fragment
            echo "wrote 4 keys into /opt/gul/.env (values not shown)"
          ' < /dev/null

      - name: Confirm the keys landed (names and value lengths only)
        run: |
          TARGET="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          ssh -i ~/.ssh/deploy_key "$TARGET" '
            for key in BACKUP_S3_ENDPOINT BACKUP_S3_ACCESS_KEY_ID BACKUP_S3_SECRET_ACCESS_KEY BACKUP_S3_BUCKET; do
              line=$(grep "^${key}=" /opt/gul/.env || true)
              if [ -z "$line" ]; then
                echo "$key: MISSING"
              else
                len=$(printf %s "${line#*=}" | wc -c)
                echo "$key: present, ${len} chars"
              fi
            done
          ' < /dev/null
