name: Add gulyaly.com to CORS_ORIGINS

# One-off: the web/admin frontends were cut over to gulyaly.com, but CORS_ORIGINS in
# /opt/gul/.env (and /opt/gul-secondary/.env) still only lists the .pro origins, so the browser
# blocks every API call from the new domain (no Access-Control-Allow-Origin header comes back).
# Adds the .com origins alongside the existing ones -- does not remove .pro yet, since nothing
# asked for that and it's harmless to still allow it.

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'Which step to run'
        required: true
        type: choice
        options:
          - show-current
          - update-primary
          - update-secondary
          - retry-recreate-secondary-api
          - recreate-secondary-api

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.SECONDARY_HOST }} >> ~/.ssh/known_hosts

      - name: Show current CORS_ORIGINS on both hosts
        if: inputs.step == 'show-current'
        run: |
          echo "--- primary /opt/gul/.env ---"
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'grep "^CORS_ORIGINS=" /opt/gul/.env || echo "(not set)"'
          echo "--- secondary /opt/gul-secondary/.env ---"
          ssh -i ~/.ssh/deploy_key ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }} 'grep "^CORS_ORIGINS=" /opt/gul-secondary/.env || echo "(not set)"'

      - name: Update CORS_ORIGINS on primary and recreate api
        if: inputs.step == 'update-primary'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            set -e
            cd /opt/gul
            CURRENT=$(grep "^CORS_ORIGINS=" .env | cut -d= -f2- | tr -d "\"")
            case ",$CURRENT," in
              *,https://gulyaly.com,*) echo "already present" ;;
              *)
                NEW="$CURRENT,https://gulyaly.com,https://www.gulyaly.com,https://admin.gulyaly.com"
                sed -i "s#^CORS_ORIGINS=.*#CORS_ORIGINS=$NEW#" .env
                echo "updated to: $NEW"
                ;;
            esac
            docker compose up -d api
          '

      - name: Update CORS_ORIGINS on secondary and recreate api
        if: inputs.step == 'update-secondary'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }} '
            set -e
            cd /opt/gul-secondary
            CURRENT=$(grep "^CORS_ORIGINS=" .env | cut -d= -f2- | tr -d "\"")
            case ",$CURRENT," in
              *,https://gulyaly.com,*) echo "already present" ;;
              *)
                NEW="$CURRENT,https://gulyaly.com,https://www.gulyaly.com,https://admin.gulyaly.com"
                sed -i "s#^CORS_ORIGINS=.*#CORS_ORIGINS=$NEW#" .env
                echo "updated to: $NEW"
                ;;
            esac
            docker compose -f docker-compose.secondary.yml up -d api
          '

      - name: Retry recreating the api container on secondary once the compose file name is known
        if: inputs.step == 'retry-recreate-secondary-api'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }} '
            set -e
            cd /opt/gul-secondary
            echo "--- what is actually here ---"
            ls -la
            echo "--- trying docker compose ps to find the right compose file ---"
            for f in *.yml *.yaml; do
              [ -f "$f" ] || continue
              echo "=== $f ==="
              docker compose -f "$f" config --services 2>&1 | head -5
            done
          '

      - name: Recreate the api container on secondary with the real compose file name
        if: inputs.step == 'recreate-secondary-api'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }} '
            set -e
            cd /opt/gul-secondary
            grep "^CORS_ORIGINS=" .env
            docker compose -f docker-compose.yml up -d api
          '
