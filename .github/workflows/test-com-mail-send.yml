name: Send a real test email for gulyaly.com DKIM verification

# One-off diagnostic: bootstraps the real Nest app context inside the running api container and
# calls EmailService.sendTest() directly -- the same code path as the admin "send test email"
# button, bypassing the JWT guard since this isn't a logged-in admin session. Sends through the
# real relay with the real gulyaly.com DKIM/SPF/MAIL_FROM now configured.

on:
  workflow_dispatch:
    inputs:
      to_email:
        description: 'Address to send the test email to'
        required: true
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Send the test email via the real EmailService
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            cd /opt/gul
            docker compose exec -T -e TEST_TO_EMAIL="${{ inputs.to_email }}" api node -e "
              const { NestFactory } = require(\"@nestjs/core\");
              const { AppModule } = require(\"./dist/src/app.module\");
              const { EmailService } = require(\"./dist/src/email/email.service\");
              (async () => {
                const app = await NestFactory.createApplicationContext(AppModule, { logger: [\"error\", \"warn\"] });
                const email = app.get(EmailService);
                await email.sendTest(process.env.TEST_TO_EMAIL);
                console.log(\"sent\");
                await app.close();
                process.exit(0);
              })().catch((e) => { console.error(e); process.exit(1); });
            " < /dev/null
          '
