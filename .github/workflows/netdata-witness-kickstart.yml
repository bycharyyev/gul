name: "Netdata - install on the witness with the official kickstart, restart the secondary's stream (one-off)"

# One-off, approved in chat 2026-10-09. The witness has no netdata package in apt, so it gets the same
# official kickstart the other two nodes use, then streams to the primary. The witness dashboard is disabled.
# The stream key comes from the secondary, masked, never printed. Deleted after running.

on:
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      PA: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      PB: ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}
      PW: ${{ secrets.WITNESS_USER }}@${{ secrets.WITNESS_HOST }}
    steps:
      - name: Run
        shell: bash {0}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/k && chmod 600 ~/.ssh/k
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          rr() { ssh -i ~/.ssh/k -o BatchMode=yes "$1" "docker run --rm --pid=host --uts=host --network=host --privileged -v /:/host alpine chroot /host /bin/sh /tmp/s.sh; rm -f /tmp/s.sh" < /dev/null; }
          KEY=$(ssh -i ~/.ssh/k -o BatchMode=yes "$PB" "docker run --rm --pid=host --uts=host --network=host --privileged -v /:/host alpine chroot /host /bin/sh -c 'grep -E \"^ *api key\" /etc/netdata/stream.conf | head -1 | sed -E \"s/.*= *//\"'" < /dev/null)
          [ -n "$KEY" ] || { echo "no key on the secondary" >&2; exit 1; }
          echo "::add-mask::$KEY"
          printf '%s\n' "$KEY" > nk.txt && chmod 600 nk.txt
          printf '%s\n' 'set -e' \
            'if ! command -v netdata >/dev/null 2>&1; then wget -q -O /tmp/ks.sh https://get.netdata.cloud/kickstart.sh && sh /tmp/ks.sh --dont-wait --disable-cloud --no-updates --stable-channel >/tmp/ks.log 2>&1 || { tail -15 /tmp/ks.log; exit 1; }; fi' \
            'K=$(cat /tmp/nk.txt); rm -f /tmp/nk.txt' \
            'printf "%s\n" "[stream]" "    enabled = yes" "    destination = 109.238.95.125:19999" "    api key = $K" > /etc/netdata/stream.conf' \
            'if [ -f /etc/netdata/netdata.conf ] && grep -q "^\[web\]" /etc/netdata/netdata.conf; then sed -i "/^\[web\]/,/^\[/ s/^\(\s*mode\s*=\).*/\1 none/" /etc/netdata/netdata.conf; fi' \
            'systemctl enable netdata >/dev/null 2>&1 || true; systemctl restart netdata' \
            'echo witness-netdata=$(systemctl is-active netdata)' > w.sh
          scp -q -i ~/.ssh/k nk.txt "$PW:/tmp/nk.txt"; scp -q -i ~/.ssh/k w.sh "$PW:/tmp/s.sh"; rr "$PW"
          printf '%s\n' 'systemctl restart netdata; echo secondary-restarted' > b.sh
          scp -q -i ~/.ssh/k b.sh "$PB:/tmp/s.sh"; rr "$PB"
          rm -f nk.txt
          sleep 150
          printf '%s\n' 'curl -s -m 8 http://127.0.0.1:19999/api/v1/info | tr "," "\n" | grep -A3 -i mirrored_hosts_status | grep hostname' > c.sh
          scp -q -i ~/.ssh/k c.sh "$PA:/tmp/s.sh"; echo "== primary now sees:"; rr "$PA"
