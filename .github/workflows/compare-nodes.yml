name: Compare the two nodes (read-only, one-off)

# One-off comparison of disk, images, volumes, journal and netdata cache on both nodes. Deleted after.

on:
  workflow_dispatch: {}

jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      PA: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      PB: ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}
    steps:
      - name: Read
        shell: bash {0}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/k && chmod 600 ~/.ssh/k
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf '%s\n' \
            'df -h / | tail -1' \
            'echo "images: $(docker images -q | wc -l)  containers: $(docker ps -aq | wc -l)"' \
            'docker system df' \
            'echo "-- volumes:"' \
            'for v in $(docker volume ls -q); do echo "$(du -sh /var/lib/docker/volumes/$v/_data 2>/dev/null | cut -f1) $v"; done' \
            'echo "-- journal: $(journalctl --disk-usage 2>/dev/null)"' \
            'echo "-- netdata cache: $(du -sh /var/cache/netdata 2>/dev/null | cut -f1)"' \
            'echo "-- /var/log: $(du -sh /var/log 2>/dev/null | cut -f1)"' \
            'echo "-- containerd: $(du -sh /var/lib/containerd 2>/dev/null | cut -f1)"' > cmp.sh
          for t in "$PA" "$PB"; do
            echo "================ $t"
            scp -q -i ~/.ssh/k cmp.sh "$t:/tmp/cmp.sh"
            ssh -i ~/.ssh/k -o BatchMode=yes "$t" "sh /tmp/cmp.sh; rm -f /tmp/cmp.sh" < /dev/null
          done
