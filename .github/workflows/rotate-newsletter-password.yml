name: Rotate newsletter SASL password + wire + verify (step 3b confirm + password rotation combined)

# The temporary password from step 3a (shown once in chat, per an explicit one-time exception) is
# not recoverable by the agent by design -- reading it back out of prior chat history is exactly
# the kind of thing that request was meant to prevent. Rather than asking the user to retype it,
# this generates a brand-new password on the runner, uses it immediately for the SASL account +
# app wiring + verification send, and never prints it anywhere (masked in logs; the caller is
# expected to have already stored it via `gh secret set` before dispatching -- see below). This
# collapses the previously-separate "confirm 3b, then rotate" steps into one atomic pass, which is
# strictly safer: there's no longer a window where the temporary password stays live any longer
# than necessary.

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'New password for the newsletter SASL account (generate locally, store in secrets, pass here -- never type a password you want kept secret directly into this box since GH renders dispatch inputs in the run UI)'
        required: true
      test_recipient:
        description: 'Address to send the verification email to'
        required: true

jobs:
  rotate-and-wire:
    runs-on: ubuntu-latest
    steps:
      - name: Mask the password
        run: echo "::add-mask::${{ inputs.password }}"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SECONDARY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rotate the SASL account password (saslpasswd2 -c overwrites the existing entry, no restart needed)
        env:
          NL_PASS: ${{ inputs.password }}
        run: |
          cat > /tmp/rotate-sasl.sh <<'SCRIPT'
          set -e
          echo '__PASS_PLACEHOLDER__' | saslpasswd2 -p -c -u mail.gulyaly.pro newsletter
          echo "--- accounts now (names only) ---"
          sasldblistusers2
          SCRIPT
          sed -i "s#__PASS_PLACEHOLDER__#$NL_PASS#" /tmp/rotate-sasl.sh
          scp -i ~/.ssh/id_ed25519 /tmp/rotate-sasl.sh ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}:/tmp/rotate-sasl.sh
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }} '
            docker run --rm --pid=host --privileged -v /:/host -v /tmp/rotate-sasl.sh:/host/tmp/rotate-sasl.sh alpine chroot /host /bin/bash /tmp/rotate-sasl.sh
            status=$?
            rm -f /tmp/rotate-sasl.sh
            exit $status
          ' < /dev/null
          rm -f /tmp/rotate-sasl.sh

      - name: Write the new password into primary's .env, restart api
        env:
          NL_PASS: ${{ inputs.password }}
        run: |
          cat > /tmp/env-update.sh <<'SCRIPT'
          set -e
          cd /opt/gul
          set_kv() {
            key="$1"; val="$2"
            if grep -q "^${key}=" .env; then
              sed -i "s#^${key}=.*#${key}=\"${val}\"#" .env
            else
              echo "${key}=\"${val}\"" >> .env
            fi
          }
          set_kv MAIL_USER_MARKETING 'newsletter'
          set_kv MAIL_PASS_MARKETING '__PASS_PLACEHOLDER__'
          set_kv MAIL_FROM_MARKETING 'Gulyaly News <news@newsletter.gulyaly.pro>'
          # --no-deps: without it, compose sees the .env file's overall hash changed (postgres
          # also has env_file: .env) and tries to recreate postgres too, alongside api -- caused a
          # real "removal of container ... already in progress" race the first time this ran.
          # Only api actually reads the MAIL_* keys this script changes.
          docker compose up -d --force-recreate --no-deps api
          SCRIPT
          sed -i "s#__PASS_PLACEHOLDER__#$NL_PASS#" /tmp/env-update.sh
          scp -i ~/.ssh/id_ed25519 /tmp/env-update.sh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/env-update.sh
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash /tmp/env-update.sh && rm -f /tmp/env-update.sh' < /dev/null
          rm -f /tmp/env-update.sh

      - name: Health-check after restart
        run: |
          for i in $(seq 1 15); do
            curl -fsS https://api.gulyaly.pro/api/health/ready > /dev/null && echo healthy && exit 0
            sleep 2
          done
          exit 1

      - name: Send verification email via curl SMTP, authenticated as newsletter, from secondary's own loopback
        env:
          NL_PASS: ${{ inputs.password }}
        run: |
          cat > /tmp/send-and-check.sh <<'SCRIPT'
          set -e
          BODY_FILE=$(mktemp)
          {
            echo "From: Gulyaly News <news@newsletter.gulyaly.pro>"
            echo "To: __RECIPIENT_PLACEHOLDER__"
            echo "Subject: [gulyaly] step 3b verification (post-rotation) -- newsletter DKIM"
            echo "Date: $(date -R)"
            echo "Content-Type: text/plain; charset=utf-8"
            echo
            echo "This verifies: SASL auth as 'newsletter' (rotated password), DKIM signing with selector news2026 for newsletter.gulyaly.pro, and the newsletter.gulyaly.pro SPF record."
            echo "Check this message's Authentication-Results header (View original / Show original) for dkim=pass s=news2026 and spf=pass."
          } > "$BODY_FILE"
          curl -v -m 20 -k --url "smtp://mail.gulyaly.pro:587" \
            --resolve "mail.gulyaly.pro:587:127.0.0.1" \
            --ssl-reqd \
            --mail-from "news@newsletter.gulyaly.pro" \
            --mail-rcpt "__RECIPIENT_PLACEHOLDER__" \
            --user "newsletter:__PASS_PLACEHOLDER__" \
            --upload-file "$BODY_FILE" 2>&1 | grep -v "^\* " | tail -40
          rm -f "$BODY_FILE"
          echo "=== mail.log tail (fallback to journalctl if rotated out) ==="
          sleep 2
          tail -n 25 /var/log/mail.log 2>/dev/null || journalctl -u postfix -u opendkim --no-pager -n 25
          SCRIPT
          sed -i "s#__RECIPIENT_PLACEHOLDER__#${{ inputs.test_recipient }}#g" /tmp/send-and-check.sh
          sed -i "s#__PASS_PLACEHOLDER__#$NL_PASS#" /tmp/send-and-check.sh
          scp -i ~/.ssh/id_ed25519 /tmp/send-and-check.sh ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}:/tmp/send-and-check.sh
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }} '
            docker run --rm --pid=host --network=host --privileged -v /:/host -v /tmp/send-and-check.sh:/host/tmp/send-and-check.sh alpine chroot /host /bin/bash /tmp/send-and-check.sh
            status=$?
            rm -f /tmp/send-and-check.sh
            exit $status
          ' < /dev/null
          rm -f /tmp/send-and-check.sh
