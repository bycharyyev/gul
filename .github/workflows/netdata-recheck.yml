name: Netdata recheck (read-only, one-off)

# One-off: streaming state of all nodes after the key fix. Deleted after reading.

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PA: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      PB: ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}
      PW: ${{ secrets.WITNESS_USER }}@${{ secrets.WITNESS_HOST }}
    steps:
      - name: Read
        shell: bash {0}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/k && chmod 600 ~/.ssh/k
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf '%s\n' \
            'hostname; systemctl is-active netdata 2>&1' \
            'echo "-- stream.conf (key presence only):"; grep -nE "^\[|enabled|destination|api key" /etc/netdata/stream.conf | sed -E "s/(api key *= *)[0-9a-f-]{36}/\1[set]/; s/^([0-9]+:\[)[0-9a-f-]{36}\]/\1[uuid]]/"' \
            'echo "-- last stream log lines:"; journalctl -u netdata --no-pager -n 300 2>/dev/null | grep -iE "stream|reject|denied|connect|parent|child" | tail -10 | sed -E "s/[0-9a-f]{8}-[0-9a-f-]{27}/[uuid]/g"' \
            'echo "-- mirrored hosts seen by this netdata:"; curl -s -m 8 http://127.0.0.1:19999/api/v1/info | tr "," "\n" | grep -iE "mirrored_hosts" | head -4' > rc.sh
          for t in "$PA" "$PB"; do
            echo "================ $t"
            scp -q -i ~/.ssh/k rc.sh "$t:/tmp/rc.sh"
            ssh -i ~/.ssh/k -o BatchMode=yes "$t" "docker run --rm --pid=host --uts=host --network=host --privileged -v /:/host alpine chroot /host /bin/sh /tmp/rc.sh; rm -f /tmp/rc.sh" < /dev/null
          done
          echo "================ witness"
          ssh -i ~/.ssh/k -o BatchMode=yes "$PW" "docker ps --format '{{.Names}}' | head; echo 'netdata on witness:'; (systemctl is-active netdata 2>&1 || true)" < /dev/null
