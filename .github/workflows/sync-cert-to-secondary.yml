name: Sync gulyaly.com cert to secondary

# One-off: certbot-once.yml only issued the new cert on the primary (DEPLOY_HOST). sync-nginx.yml
# then correctly failed nginx -t on the secondary, which doesn't have
# /etc/letsencrypt/live/gulyaly.com/ at all, and did NOT reload -- the secondary is still running
# its previous config in memory, just with the new (currently broken) vhost files sitting on disk.
# Copies the whole /etc/letsencrypt tree the same way sync-ssl-to-new-vps.yml did for the original
# OLD_VPS -> primary migration, then reloads.

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.SECONDARY_HOST }} >> ~/.ssh/known_hosts

      - name: Pack certs on the primary
        run: |
          ssh -o ServerAliveInterval=15 -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            set -e
            docker run --rm -v /etc/letsencrypt:/letsencrypt:ro -v /tmp:/out alpine \
              sh -c "tar czf /out/le.tar.gz -C / letsencrypt && chown $(id -u):$(id -g) /out/le.tar.gz"
            ls -lh /tmp/le.tar.gz
          '

      - name: Move certs to the secondary via the runner
        run: |
          scp -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/le.tar.gz ./le.tar.gz
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'rm -f /tmp/le.tar.gz'
          scp -i ~/.ssh/deploy_key ./le.tar.gz ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}:/tmp/le.tar.gz
          rm -f ./le.tar.gz

      - name: Install cert on the secondary and reload nginx
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }} '
            set -e
            SCRIPT=/tmp/install-cert.sh
            {
              echo "#!/bin/sh"
              echo "set -e"
              echo "tar xzf /tmp/le.tar.gz -C /etc"
              echo "rm -f /tmp/le.tar.gz"
              echo "nginx -t"
              echo "systemctl reload nginx"
            } > "$SCRIPT"
            chmod +x "$SCRIPT"
            docker run --rm --pid=host --privileged -v /:/host -v /tmp:/tmp alpine chroot /host /bin/sh "$SCRIPT"
            rm -f "$SCRIPT"
            echo "secondary now has the cert and reloaded"
          '

      - name: Verify TLS on the secondary directly
        run: |
          fail=0
          for spec in "gulyaly.com:/" "www.gulyaly.com:/" "api.gulyaly.com:/api/health" "admin.gulyaly.com:/"; do
            host="${spec%%:*}"; path="${spec#*:}"
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              --resolve "$host:443:${{ secrets.SECONDARY_HOST }}" "https://$host$path" || echo 000)
            echo "https://$host$path (secondary) -> $code"
            case "$code" in 2*|3*) ;; *) echo "  ^ unexpected" >&2; fail=1;; esac
          done
          [ "$fail" = 0 ] || exit 1
