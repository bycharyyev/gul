name: Set or rotate UNSUBSCRIBE_SECRET on both hosts

# Writes UNSUBSCRIBE_SECRET -- the key that signs marketing unsubscribe links (S-10 in
# docs/analysis/SECURITY.md) -- into /opt/gul/.env and /opt/gul-secondary/.env, then recreates
# api on both nodes. Until it is set the API falls back to JWT_ACCESS_SECRET.
#
# The value is generated here, in the run, and never printed: it goes to each host by substitution
# into a script file (see the devops skill), not on a command line. Both hosts get the SAME value --
# they serve the same links active/active. The API keeps accepting links signed with
# JWT_ACCESS_SECRET, so mail sent before the first run keeps working. Rotating later (rotate=true)
# invalidates unsubscribe links in mail sent under the previous value; do it only after a leak.
#
# Refuses to overwrite an existing value unless rotate=true, so a re-run is harmless.

on:
  workflow_dispatch:
    inputs:
      rotate:
        description: "Replace an existing UNSUBSCRIBE_SECRET (breaks links in mail already sent under it)"
        type: boolean
        default: false

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH (pinned host keys)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Refuse to overwrite unless asked
        if: ${{ !inputs.rotate }}
        run: |
          for target in "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} /opt/gul" \
                        "${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }} /opt/gul-secondary"; do
            set -- $target
            if ssh -i ~/.ssh/deploy_key "$1" "grep -q '^UNSUBSCRIBE_SECRET=..' $2/.env" < /dev/null; then
              echo "UNSUBSCRIBE_SECRET is already set in $2/.env -- re-run with rotate=true to replace it." >&2
              exit 1
            fi
          done
          echo "Not set on either host; continuing."

      - name: Generate, write to both hosts, restart api
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"

          cat > /tmp/set-unsub.sh <<'SCRIPT'
          set -e
          cd "$1"
          value='__UNSUBSCRIBE_SECRET__'
          if grep -q '^UNSUBSCRIBE_SECRET=' .env; then
            sed -i "s#^UNSUBSCRIBE_SECRET=.*#UNSUBSCRIBE_SECRET=\"$value\"#" .env
          else
            echo "UNSUBSCRIBE_SECRET=\"$value\"" >> .env
          fi

          # Same recreate-and-wait as set-topup-gateway.yml: `up -d` can race its own teardown.
          for attempt in 1 2 3; do
            docker compose up -d --force-recreate --no-deps api && break
            echo "up attempt $attempt failed; retrying in $((attempt * 10))s" >&2
            sleep $((attempt * 10))
          done
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4000/api/health/ready > /dev/null && echo "healthy: $1" && exit 0
            sleep 2
          done
          echo "did NOT come back healthy: $1" >&2
          exit 1
          SCRIPT
          sed -i "s#__UNSUBSCRIBE_SECRET__#$secret#" /tmp/set-unsub.sh

          run_on() {
            scp -i ~/.ssh/deploy_key /tmp/set-unsub.sh "$1:/tmp/set-unsub.sh"
            ssh -i ~/.ssh/deploy_key "$1" "bash /tmp/set-unsub.sh $2; rc=\$?; rm -f /tmp/set-unsub.sh; exit \$rc" < /dev/null
          }
          run_on "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" /opt/gul
          run_on "${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}" /opt/gul-secondary
          rm -f /tmp/set-unsub.sh

      - name: Confirm both hosts hold the same value (lengths and a fingerprint only)
        run: |
          fp() { ssh -i ~/.ssh/deploy_key "$1" "grep '^UNSUBSCRIBE_SECRET=' $2/.env | sha256sum | cut -c1-12" < /dev/null; }
          a=$(fp "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" /opt/gul)
          b=$(fp "${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}" /opt/gul-secondary)
          echo "primary fingerprint:   $a"
          echo "secondary fingerprint: $b"
          [ -n "$a" ] && [ "$a" = "$b" ] || { echo "Hosts disagree -- unsubscribe links would verify on one node only" >&2; exit 1; }
