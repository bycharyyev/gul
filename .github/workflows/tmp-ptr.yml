name: tmp ptr
on:
  workflow_dispatch:
jobs:
  ptr:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.TIMEWEB_API_TOKEN }}
    steps:
      - name: Find server owning the relay IP
        run: |
          IP="${{ secrets.SECONDARY_HOST }}"
          curl -s "https://api.timeweb.cloud/api/v1/servers?limit=100" -H "Authorization: Bearer $T" | jq -c --arg ip "$IP" '.servers[]? | select(any(.networks[]?.ips[]?; .ip==$ip)) | {id, name, ips: [.networks[].ips[] | {ip, ptr, type}]}'
          echo "servers total:"; curl -s "https://api.timeweb.cloud/api/v1/servers?limit=100" -H "Authorization: Bearer $T" | jq -c '[.servers[]?|{id,name}]'
