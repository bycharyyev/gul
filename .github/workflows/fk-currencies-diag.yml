name: One-off - FreeKassa payment methods for the shop

# Read-only: asks the FreeKassa API (from the primary, whose address the API sees) which payment
# methods the shop can take, and whether each is available now. Prints method ids, names and
# statuses only. Delete after use.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      PRIMARY: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      SHOP: ${{ secrets.FREEKASSA_SHOP_ID }}
      KEY: ${{ secrets.FREEKASSA_API_KEY }}
      SW1: ${{ secrets.FREEKASSA_SECRET_WORD_1 }}
    steps:
      - name: Set up SSH (pinned host keys)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ask FreeKassa
        run: |
          n=0
          call() { # call <path>
            n=$((n + 1))
            nonce=$(( $(date +%s%3N) + n ))
            sig=$(printf '%s|%s' "$nonce" "$SHOP" | openssl dgst -sha256 -hmac "$KEY" -r | cut -d' ' -f1)
            body=$(printf '{"shopId":%s,"nonce":%s,"signature":"%s"}' "$SHOP" "$nonce" "$sig")
            ssh -i ~/.ssh/deploy_key "$PRIMARY" "curl -s -m 20 -X POST -H 'Content-Type: application/json' -d '$body' https://api.fk.life/v1$1" < /dev/null
          }
          list=$(call /currencies)
          echo "type: $(echo "$list" | jq -r '.type') $(echo "$list" | jq -r '.message // empty')"
          echo "$list" | jq -r '.currencies[]? | "\(.id)\t\(.name)\t\(.currency)\tenabled=\(.is_enabled)\tfavorite=\(.is_favorite)\tlimits=\(.limits // {} | tostring)"'
          for id in $(echo "$list" | jq -r '.currencies[]?.id'); do
            echo "status $id: $(call /currencies/$id/status | jq -c '{type, message: (.message // null)}')"
          done

      # Signed links to the hosted form for a made-up 10 RUB order, with and without a suggested
      # method (i), to open in a browser. Nothing is paid unless someone pays; the order id is
      # unknown to our API, so a payment could not be credited anywhere.
      - name: Hosted form links per method
        run: |
          amount=10.00; cur=RUB; o="diag-$(date +%s)"
          s=$(printf '%s:%s:%s:%s:%s' "$SHOP" "$amount" "$SW1" "$cur" "$o" | md5sum | cut -d' ' -f1)
          for i in none 36 42 4 12; do
            q="m=$SHOP&oa=$amount&currency=$cur&o=$o&s=$s&lang=ru"
            [ "$i" = none ] || q="$q&i=$i"
            echo "LINK i=$i https://pay.fk.money/?$q" | sed "s/$SHOP/SHOPID/g"
          done
