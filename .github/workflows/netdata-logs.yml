name: Netdata logs for streaming (read-only, one-off)

# One-off: why the primary does not accept the secondary's stream. Keys are masked. Deleted after reading.

on:
  workflow_dispatch: {}

jobs:
  logs:
    runs-on: ubuntu-latest
    env:
      PA: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      PB: ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}
    steps:
      - name: Read
        shell: bash {0}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/k && chmod 600 ~/.ssh/k
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf '%s\n' \
            'ls /var/log/netdata/ 2>&1' \
            'for f in /var/log/netdata/error.log /var/log/netdata/daemon.log /var/log/netdata/access.log; do [ -f $f ] && { echo "== $f"; tail -n 25 $f | sed -E "s/[0-9a-f]{8}-[0-9a-f-]{27}/[uuid]/g"; }; done' \
            'echo "== journal (netdata, stream/key/reject):"; journalctl -u netdata --no-pager -n 500 2>/dev/null | grep -iE "stream|key|reject|denied|unauth|guid|parent|child|host" | tail -15 | sed -E "s/[0-9a-f]{8}-[0-9a-f-]{27}/[uuid]/g"' \
            'echo "== sections in stream.conf (count):"; grep -cE "^\[" /etc/netdata/stream.conf' \
            'echo "== netdata machine guid present:"; ls /var/lib/netdata/registry/ 2>/dev/null | head -3' > lg.sh
          for t in "$PA" "$PB"; do
            echo "================ $t"
            scp -q -i ~/.ssh/k lg.sh "$t:/tmp/lg.sh"
            ssh -i ~/.ssh/k -o BatchMode=yes "$t" "docker run --rm --pid=host --uts=host --network=host --privileged -v /:/host alpine chroot /host /bin/sh /tmp/lg.sh; rm -f /tmp/lg.sh" < /dev/null
          done
