name: HA diagnostics (read-only)

# What each data node thinks right now: containers, redis role and link, what the two HAProxy
# routers log, whether the API's readiness answers locally, and recent API log lines. Read-only.

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      PA: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      PB: ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}
    steps:
      - name: Set up SSH (pinned host keys)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf '%s\n' 'Host *' '  IdentityFile ~/.ssh/deploy_key' > ~/.ssh/config

      - name: Inspect both nodes
        run: |
          for t in "$PA:/opt/gul" "$PB:/opt/gul-secondary"; do
            host=${t%%:*}; dir=${t#*:}
            echo "================ $dir ================"
            ssh "$host" "DIR='$dir' bash -s" <<'REMOTE'
            cd "$DIR"
            P=$(grep -E '^REDIS_PASSWORD=' .env | head -1 | cut -d= -f2- | sed -E "s/^[\"'](.*)[\"']\$/\1/")
            echo "--- containers ---"; docker ps --format '{{.Names}}\t{{.Status}}' | sort
            echo "--- gul-redis replication ---"
            docker exec gul-redis redis-cli --no-auth-warning -a "$P" info replication 2>&1 | grep -E '^(role|master_link_status|connected_slaves|master_host)' | sed -E 's/(master_host:).*/\1(hidden)/'
            echo "--- redis router (haproxy) log ---"; docker compose logs --tail 15 redis 2>&1 | tail -15
            echo "--- readiness, local, 6 s ---"
            for p in 4000 4001; do echo "$p: $(curl -s -m 6 http://127.0.0.1:$p/api/health/ready || echo TIMEOUT)"; done
            echo "--- api log ---"; docker compose logs --tail 25 api 2>&1 | grep -viE 'GET /api/health' | tail -25
          REMOTE
          done
