name: "Netdata - open the stream port for the secondary, add the witness (one-off)"

# One-off, approved in chat 2026-10-09. (1) The primary's firewall never allowed port 19999 from the
# secondary, so its stream was refused: allow it. (2) Remove a stale 5432 rule for the deleted Novosibirsk
# server. (3) Install netdata on the witness as a streaming child (no dashboard on it, only the stream to the
# primary), and open 19999 from the witness address on the primary. The stream key is taken from the
# secondary, masked, and never printed. Deleted after running.

on:
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      PA: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      PB: ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}
      PW: ${{ secrets.WITNESS_USER }}@${{ secrets.WITNESS_HOST }}
      WIP: ${{ secrets.WITNESS_HOST }}
    steps:
      - name: Run
        shell: bash {0}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/k && chmod 600 ~/.ssh/k
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          rr() { ssh -i ~/.ssh/k -o BatchMode=yes "$1" "docker run --rm --pid=host --uts=host --network=host --privileged -v /:/host alpine chroot /host /bin/sh /tmp/s.sh; rm -f /tmp/s.sh" < /dev/null; }
          # 1+2: primary firewall
          printf '%s\n' 'ufw allow from 91.184.250.89 to any port 19999 proto tcp comment "netdata stream gul-b"' 'ufw delete allow from 129.101.113.157 to any port 5432 proto tcp || true' 'ufw status | grep 19999 || true' > s.sh
          scp -q -i ~/.ssh/k s.sh "$PA:/tmp/s.sh"; rr "$PA"
          # key from the secondary's stream.conf, to a masked file
          KEY=$(ssh -i ~/.ssh/k -o BatchMode=yes "$PB" "docker run --rm --pid=host --uts=host --network=host --privileged -v /:/host alpine chroot /host /bin/sh -c 'grep -E \"^ *api key\" /etc/netdata/stream.conf | head -1 | sed -E \"s/.*= *//\"'" < /dev/null)
          [ -n "$KEY" ] || { echo "no key on the secondary" >&2; exit 1; }
          echo "::add-mask::$KEY"
          printf '%s\n' "$KEY" > nk.txt && chmod 600 nk.txt
          # 3: witness netdata as a child
          printf '%s\n' 'set -e' 'export DEBIAN_FRONTEND=noninteractive' \
            'command -v netdata >/dev/null 2>&1 || { apt-get update -y >/dev/null && apt-get install -y netdata >/dev/null; }' \
            'K=$(cat /tmp/nk.txt); rm -f /tmp/nk.txt' \
            'printf "%s\n" "[stream]" "    enabled = yes" "    destination = 109.238.95.125:19999" "    api key = $K" > /etc/netdata/stream.conf' \
            'if grep -q "^\[web\]" /etc/netdata/netdata.conf; then sed -i "/^\[web\]/,/^\[/ s/^\(\s*mode\s*=\).*/\1 none/" /etc/netdata/netdata.conf; fi' \
            'systemctl enable --now netdata >/dev/null 2>&1; systemctl restart netdata' \
            'echo witness-netdata-$(systemctl is-active netdata)' > w.sh
          scp -q -i ~/.ssh/k nk.txt "$PW:/tmp/nk.txt"; scp -q -i ~/.ssh/k w.sh "$PW:/tmp/s.sh"; rr "$PW"
          # open the witness to the stream port on the primary
          printf '%s\n' "ufw allow from $WIP to any port 19999 proto tcp comment \"netdata stream gul-w\"" 'ufw status | grep 19999 || true' > s.sh
          scp -q -i ~/.ssh/k s.sh "$PA:/tmp/s.sh"; rr "$PA"
          rm -f nk.txt
          sleep 90
          printf '%s\n' 'curl -s -m 8 http://127.0.0.1:19999/api/v1/info | tr "," "\n" | grep -A3 -i mirrored_hosts_status | grep hostname' > c.sh
          scp -q -i ~/.ssh/k c.sh "$PA:/tmp/s.sh"; echo "== primary now sees:"; rr "$PA"
