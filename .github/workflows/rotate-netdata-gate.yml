name: Rotate netdata-gate credentials (GATE_PASS + GATE_SECRET)

# Rotates the login-gate credentials for the Netdata dashboard on primary (netdata-gate.service,
# /opt/netdata-gate/netdata_gate.py) without ever printing them to a workflow log. Values are
# generated by the caller and passed in already-final -- this workflow only masks and applies them.
#
# Triggered 2026-08-28 because `diagnose.yml`'s `systemctl cat netdata-gate.service` step printed
# both values in plaintext to a GH Actions run log (fixed in the same commit as this file --
# diagnose.yml no longer dumps that unit's Environment= lines).

on:
  workflow_dispatch:
    inputs:
      gate_pass:
        description: 'New GATE_PASS value (generate it yourself before dispatching, e.g. openssl rand)'
        required: true
      gate_secret:
        description: 'New GATE_SECRET value'
        required: true

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Mask both values
        run: |
          echo "::add-mask::${{ inputs.gate_pass }}"
          echo "::add-mask::${{ inputs.gate_secret }}"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Fetch current unit file (to a remote temp path, never echoed)
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            systemctl cat netdata-gate.service > /tmp/gate.service.work 2>/dev/null
          ' < /dev/null

      - name: Replace only the two Environment= lines, apply, reload, restart
        env:
          GATE_PASS: ${{ inputs.gate_pass }}
          GATE_SECRET: ${{ inputs.gate_secret }}
        run: |
          cat > /tmp/apply-gate.sh <<'SCRIPT'
          set -e
          sed -i "s#^Environment=GATE_PASS=.*#Environment=GATE_PASS=__PASS_PLACEHOLDER__#" /tmp/gate.service.work
          sed -i "s#^Environment=GATE_SECRET=.*#Environment=GATE_SECRET=__SECRET_PLACEHOLDER__#" /tmp/gate.service.work
          # First line from `systemctl cat` is a "# /etc/..." comment header -- strip it, real
          # unit files don't start with that when written back to disk.
          sed -i '/^# \/etc\/systemd\/system\/netdata-gate.service$/d' /tmp/gate.service.work
          docker run --rm --pid=host --privileged -v /:/host -v /tmp/gate.service.work:/host/tmp/gate.service.new alpine chroot /host /bin/sh -c "
            cp /tmp/gate.service.new /etc/systemd/system/netdata-gate.service &&
            systemctl daemon-reload &&
            systemctl restart netdata-gate.service &&
            systemctl is-active netdata-gate.service
          "
          # /tmp/gate.service.new only exists as the bind-mount alias inside the throwaway
          # container -- there's nothing by that name on the actual host to remove.
          rm -f /tmp/gate.service.work
          SCRIPT
          sed -i "s#__PASS_PLACEHOLDER__#$GATE_PASS#" /tmp/apply-gate.sh
          sed -i "s#__SECRET_PLACEHOLDER__#$GATE_SECRET#" /tmp/apply-gate.sh
          scp -i ~/.ssh/id_ed25519 /tmp/apply-gate.sh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/apply-gate.sh"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash /tmp/apply-gate.sh && rm -f /tmp/apply-gate.sh' < /dev/null
          rm -f /tmp/apply-gate.sh

      - name: Confirm the login endpoint responds (not a functional test, just "is it up")
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" -m 10 https://admin.gulyaly.pro/netdata-login || true
