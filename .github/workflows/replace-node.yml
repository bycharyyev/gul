name: Replace a dead node (buys a Timeweb server unless use_host is given)

# HA step 5: turns "a node is gone" into "a new node has taken its place", without a human.
# Dispatched by the witness (infra/witness/watch.sh) once a node has been down for 15 minutes,
# or by hand. Deliberately NOT in the "danger" environment -- it has to work at night -- so it
# guards itself instead:
#   * mode=auto re-proves the node is dead from GitHub's side (HTTPS and SSH both fail, three
#     times over two minutes) before spending anything; a node that answers is left alone.
#   * at most one auto-bought server at a time: if a Timeweb server named gul-auto-* exists, it
#     refuses and alerts. Rename it in the Timeweb panel (anything without that prefix) to accept it.
#   * use_host must not be a current member (it is wiped and rebuilt).
#
# What it does (the dead node's ROLE -- primary or secondary -- passes to the new host):
#   provision -> fence the dead address (firewall rules gone on survivor + witness, etcd member
#   removed: if the old machine comes back it can reach nothing and join nothing) -> etcd member
#   for the new host -> gul-pg (Patroni clones from the leader) -> gul-redis replica + Sentinel ->
#   app (.env from the survivor, same image tag) -> nginx + certs -> secrets (DEPLOY_HOST or
#   SECONDARY_HOST, SSH_KNOWN_HOSTS) -> DNS -> self-heal, backups, witness reinstalled -> Telegram.
#
# Needs repository secret ADMIN_GH_TOKEN: fine-grained, this repository, "Secrets: read and write"
# (to record the new host); checked before anything is bought.

on:
  workflow_dispatch:
    inputs:
      node:
        description: 'Which role is dead'
        type: choice
        options: [secondary, primary]
      mode:
        description: 'auto = prove it is dead first; drill = replace even if it answers'
        type: choice
        options: [auto, drill]
        default: auto
      use_host:
        description: 'Rebuild onto this existing host (deploy key + docker) instead of buying one'
        required: false
        default: ''
      confirm:
        description: 'Type REPLACE'
        required: true

concurrency:
  group: etcd
  cancel-in-progress: false

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
      actions: write
    env:
      CURL_HOME: ${{ github.workspace }}/.github/curl
      TOKEN: ${{ secrets.TIMEWEB_API_TOKEN }}
      TG_TOKEN: ${{ secrets.TELEGRAM_ADMIN_BOT_TOKEN }}
      TG_CHAT: ${{ vars.ADMIN_TELEGRAM_CHAT_ID }}
      ROLE: ${{ inputs.node }}
      MODE: ${{ inputs.mode }}
      USE_HOST: ${{ inputs.use_host }}
      A: ${{ secrets.DEPLOY_HOST }}
      B: ${{ secrets.SECONDARY_HOST }}
      W: ${{ secrets.WITNESS_HOST }}
      PW: ${{ secrets.WITNESS_USER }}@${{ secrets.WITNESS_HOST }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/gul-patroni:16
    steps:
      - name: Refuse without confirmation
        if: inputs.confirm != 'REPLACE'
        run: |
          echo "confirm must be REPLACE" >&2
          exit 1

      - uses: actions/checkout@v7

      - name: Roles, SSH, guards
        env:
          ADMIN_GH_TOKEN: ${{ secrets.ADMIN_GH_TOKEN }}
        run: |
          set -e
          [ -n "$ADMIN_GH_TOKEN" ] || { echo "secret ADMIN_GH_TOKEN is missing -- the new host could not be recorded; refusing before buying anything" >&2; exit 1; }
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf '%s\n' 'Host *' '  IdentityFile ~/.ssh/deploy_key' '  ServerAliveInterval 15' '  ConnectTimeout 10' > ~/.ssh/config
          if [ "$ROLE" = secondary ]; then
            { echo "DEAD=$B"; echo "SURV=$A"; echo "SURV_DIR=/opt/gul"; echo "DIR=/opt/gul-secondary"
              echo "NAME=gul-b"; echo "SURV_NAME=gul-a"; echo "HOST_SECRET=SECONDARY_HOST"; echo "COMPOSE=docker-compose.secondary.yml"; } >> "$GITHUB_ENV"
          else
            { echo "DEAD=$A"; echo "SURV=$B"; echo "SURV_DIR=/opt/gul-secondary"; echo "DIR=/opt/gul"
              echo "NAME=gul-a"; echo "SURV_NAME=gul-b"; echo "HOST_SECRET=DEPLOY_HOST"; echo "COMPOSE=docker-compose.prod.yml"; } >> "$GITHUB_ENV"
          fi
          echo "PS=deploy@$( [ "$ROLE" = secondary ] && echo "$A" || echo "$B" )" >> "$GITHUB_ENV"
          if [ -n "$USE_HOST" ]; then
            case " $A $B $W " in *" $USE_HOST "*) echo "use_host is a current member -- refusing to wipe it" >&2; exit 1;; esac
          fi

      - name: Telegram helper
        run: |
          mkdir -p ~/bin
          printf '%s\n' '#!/bin/sh' '[ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || exit 0' \
            'curl -q -s -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=$1" || true' > ~/bin/tg
          chmod 755 ~/bin/tg
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Prove the node is dead (mode=auto)
        if: inputs.mode == 'auto'
        run: |
          for round in 1 2 3; do
            code=$(curl -s -o /dev/null -m 10 --resolve "api.gulyaly.com:443:$DEAD" -w '%{http_code}' https://api.gulyaly.com/api/health/ready || true)
            if [ "$code" = 200 ] || ssh -o BatchMode=yes "deploy@$DEAD" true < /dev/null 2>/dev/null; then
              echo "the $ROLE node answers (HTTPS $code or SSH) -- not dead, nothing bought"
              tg "ℹ️ Gulyaly: запрос на замену сервера ($ROLE), но он отвечает — замена отменена."
              exit 1
            fi
            echo "round $round: HTTPS $code, SSH down"
            [ "$round" -lt 3 ] && sleep 60
          done
          echo "the $ROLE node is dead"

      - name: Guard -- one auto-bought server at a time; balance
        if: inputs.use_host == ''
        run: |
          set -e
          api() { curl -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" "$@"; }
          auto=$(api https://api.timeweb.cloud/api/v1/servers | jq -r '[.servers[] | select(.name | startswith("gul-auto-"))] | length')
          if [ "$auto" != 0 ]; then
            tg "⛔ Gulyaly: $ROLE сервер мёртв, но автозамена заблокирована — уже есть автокупленный сервер (gul-auto-*). Переименуйте его в панели Timeweb, чтобы разрешить следующую."
            echo "an auto-bought server already exists -- refusing" >&2; exit 1
          fi
          api https://api.timeweb.cloud/api/v1/account/finances | jq -c '.finances | {balance, hours_left}'
          tg "🛠 Gulyaly: $ROLE сервер мёртв. Покупаю замену на Timeweb и настраиваю автоматически (~20–30 мин)."

      - name: Provision (presets in order until one has capacity)
        if: inputs.use_host == ''
        run: |
          set -e
          api() { curl -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" "$@"; }
          ssh-keygen -y -f ~/.ssh/deploy_key > /tmp/deploy_key.pub
          body=$(cut -d' ' -f1,2 /tmp/deploy_key.pub)
          key=$(api https://api.timeweb.cloud/api/v1/ssh-keys | jq -r --arg b "$body" '.ssh_keys[] | select((.body | split(" ")[0:2] | join(" ")) == $b) | .id' | head -1)
          [ -n "$key" ] || key=$(api -X POST https://api.timeweb.cloud/api/v1/ssh-keys -d "$(jq -n --arg b "$(cat /tmp/deploy_key.pub)" '{name: "gul-deploy", body: $b, is_default: false}')" | jq -r '.ssh_key.id')
          printf '%s\n' '#cloud-config' 'package_update: true' 'users:' '  - default' '  - name: deploy' '    shell: /bin/bash' \
            '    ssh_authorized_keys:' "      - $(cat /tmp/deploy_key.pub)" 'runcmd:' \
            '  - [sh, -c, "curl -fsSL https://get.docker.com | sh"]' '  - [usermod, -aG, docker, deploy]' > /tmp/ci.yml
          name="gul-auto-$ROLE-$(date -u +%Y%m%d%H%M)"
          # 4801 Cloud MSK 50, 2453 Cloud-50 (SPb), 2579 SSD-50 (SPb), 4243 Cloud NSK 50.
          for preset in 4801 2453 2579 4243; do
            payload=$(jq -n --arg n "$name" --argjson p "$preset" --argjson k "$key" --rawfile ci /tmp/ci.yml \
              '{name: $n, preset_id: $p, os_id: 99, ssh_keys_ids: [$k], is_ddos_guard: false, cloud_init: $ci}')
            if resp=$(api -X POST https://api.timeweb.cloud/api/v1/servers -d "$payload" 2>/dev/null); then
              sid=$(echo "$resp" | jq -r '.server.id'); echo "preset $preset: server $sid"; break
            fi
            echo "preset $preset refused: $(echo "$resp" | jq -r '.error_code // .message // .' 2>/dev/null | head -c 200)"
            sid=""
          done
          [ -n "$sid" ] || { tg "❌ Gulyaly: Timeweb не дал сервер ни в одном городе. Сайт работает на одном сервере; нужна ручная замена."; exit 1; }
          echo "SID=$sid" >> "$GITHUB_ENV"
          ordered=0
          for i in $(seq 1 120); do
            s=$(api "https://api.timeweb.cloud/api/v1/servers/$sid")
            st=$(echo "$s" | jq -r '.server.status')
            ip=$(echo "$s" | jq -r '[.server.networks[]? | select(.type == "public") | .ips[]? | select(.type == "ipv4") | .ip][0] // empty')
            if [ "$st" = on ] && [ -z "$ip" ] && [ "$ordered" = 0 ]; then api -X POST "https://api.timeweb.cloud/api/v1/servers/$sid/ips" -d '{"type":"ipv4"}' >/dev/null; ordered=1; fi
            [ "$st" = on ] && [ -n "$ip" ] && break
            sleep 10
          done
          [ -n "$ip" ] || { echo "no IP after 20 min" >&2; exit 1; }
          echo "USE_HOST=$ip" >> "$GITHUB_ENV"
          for i in $(seq 1 90); do ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes "deploy@$ip" true < /dev/null 2>/dev/null && break; sleep 10; done
          ssh -o BatchMode=yes "deploy@$ip" 'cloud-init status --wait >/dev/null; true' < /dev/null
          if ! ssh "deploy@$ip" 'command -v docker' < /dev/null >/dev/null; then
            ssh -o StrictHostKeyChecking=accept-new "root@$ip" 'curl -fsSL https://get.docker.com | sh >/tmp/d.log 2>&1 || { tail -20 /tmp/d.log; exit 1; }; usermod -aG docker deploy' < /dev/null
          fi
          echo "new host ready with docker"

      - name: Host key, clean slate, base setup on the new host
        run: |
          set -e
          H=$USE_HOST
          [ -n "$H" ] || { echo "no host" >&2; exit 1; }
          echo "H=$H" >> "$GITHUB_ENV"
          line=$(ssh-keyscan -t ed25519 "$H" 2>/dev/null | head -1)
          [ -n "$line" ] || { echo "no host key from the new host" >&2; exit 1; }
          echo "$line" >> ~/.ssh/known_hosts
          echo "HOSTKEY_LINE=$line" >> "$GITHUB_ENV"
          printf '%s\n' '#!/bin/sh' 'set -e' \
            "mkdir -p $DIR && chown deploy:deploy $DIR" \
            'printf "%s\n" "PasswordAuthentication no" "KbdInteractiveAuthentication no" "PermitRootLogin prohibit-password" > /etc/ssh/sshd_config.d/00-gul-hardening.conf' \
            'sshd -t && (systemctl reload ssh 2>/dev/null || systemctl reload sshd)' \
            'command -v ufw >/dev/null || (apt-get update -y && apt-get install -y ufw)' \
            'ufw allow 22/tcp' 'ufw allow 80/tcp' 'ufw allow 443/tcp' \
            "for p in $SURV $W; do ufw allow from \$p to any port 2379,2380,26379 proto tcp; done" \
            "ufw allow from $SURV to any port 5432,8008,6379 proto tcp" \
            "ufw allow from $W to any port 6379 proto tcp" \
            'ufw allow from 172.16.0.0/12 to any port 5432,8008,6379,26379 proto tcp' \
            'ufw --force enable' > base.sh
          scp -q base.sh "deploy@$H:/tmp/base.sh"
          ssh "deploy@$H" bash -s <<'REMOTE'
          set -e
          # Clean slate: a reused host (use_host) may carry an old member's state, which must not
          # rejoin anything. A freshly bought one has none of this.
          docker rm -f gul-etcd gul-pg gul-redis gul-sentinel pg-standby >/dev/null 2>&1 || true
          for d in /opt/gul /opt/gul-secondary; do [ -f "$d/docker-compose.yml" ] && (cd "$d" && docker compose down --remove-orphans >/dev/null 2>&1 || true); done
          docker volume rm gul-etcd-data gul-pg-data gul-redis-data gul-sentinel >/dev/null 2>&1 || true
          docker run --rm --pid=host --network=host --privileged -v /:/host alpine chroot /host /bin/sh /tmp/base.sh
          rm -f /tmp/base.sh
          REMOTE
          tg "🔧 Gulyaly: новый сервер для роли $ROLE получен, настраиваю."

      - name: A live node being replaced (drill, failback) hands over its leaderships first
        if: inputs.mode == 'drill'
        run: |
          set -e
          if [ "$(ssh "$PS" "curl -s -o /dev/null -w '%{http_code}' http://$DEAD:8008/primary" < /dev/null || true)" = 200 ]; then
            echo "the node being replaced leads Postgres: switching over to $SURV_NAME"
            ssh "$PS" "docker exec -e C='$SURV_NAME' gul-pg sh -c 'PATRONI_CTL_USERNAME=patroni PATRONI_CTL_PASSWORD=\"\$REPLICATOR_PASSWORD\" patronictl -c /tmp/patroni.yml switchover gul --candidate \"\$C\" --force'" < /dev/null
            for i in $(seq 1 40); do [ "$(ssh "$PS" "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8008/primary" < /dev/null)" = 200 ] && break; sleep 3; done
          fi
          M=$(ssh "$PW" "docker exec gul-sentinel redis-cli -p 26379 sentinel get-master-addr-by-name gul | head -1" < /dev/null)
          if [ "$M" = "$DEAD" ]; then
            echo "the node being replaced is the Redis master: failing over"
            ssh "$PW" "docker exec gul-sentinel redis-cli -p 26379 sentinel failover gul" < /dev/null
            for i in $(seq 1 30); do
              [ "$(ssh "$PW" "docker exec gul-sentinel redis-cli -p 26379 sentinel get-master-addr-by-name gul | head -1" < /dev/null)" != "$DEAD" ] && break; sleep 2
            done
          fi

      - name: Fence the dead address; open the survivor and witness to the new host
        run: |
          set -e
          fence() { # fence <user@host> <ports for the new host>
            printf '%s\n' '#!/bin/sh' \
              "for n in \$(ufw status numbered | grep -F ' $DEAD ' | sed -n 's/^\[ *\([0-9]*\)\].*/\1/p' | sort -rn); do ufw --force delete \$n; done" \
              "ufw allow from $H to any port $2 proto tcp comment 'gul node'" \
              "ufw status | grep -cF '$DEAD' || true" > fence.sh
            scp -q fence.sh "$1:/tmp/fence.sh"
            ssh "$1" "docker run --rm --pid=host --network=host --privileged -v /:/host alpine chroot /host /bin/sh /tmp/fence.sh; rm -f /tmp/fence.sh" < /dev/null
          }
          fence "$PS" 2379,2380,5432,8008,6379,26379
          fence "$PW" 2379,2380,26379
          echo "dead address fenced off on survivor and witness"

      - name: etcd -- remove the dead member, add the new host
        run: |
          set -e
          E="http://$SURV:2379,http://$W:2379"
          ec() { ssh "$PW" "docker exec gul-etcd etcdctl --endpoints=$E $*" < /dev/null; }
          id=$(ec member list | awk -F', ' -v n="$NAME" '$3 == n {print $1}')
          [ -n "$id" ] && ec member remove "$id"
          # Removing the member that was the raft leader starts an election; an add sent during it
          # times out (seen in the first drill). Retry until the cluster has a leader again.
          if ! ec member list | grep -q "http://$H:2380"; then
            for i in $(seq 1 12); do
              ec member add "$NAME" --peer-urls="http://$H:2380" >/dev/null 2>&1 && break
              echo "member add not accepted yet (election?), retrying"; sleep 5
            done
          fi
          ec member list | grep -q "http://$H:2380" || { echo "could not add the new host to etcd" >&2; exit 1; }
          CLUSTER=$(ec member list | awk -F', ' -v n="$NAME" -v h="$H" '{peer=$4; if ($3==n || $3=="") {print n"=http://"h":2380"} else print $3"="peer}' | paste -sd, -)
          echo "cluster: $(echo "$CLUSTER" | sed 's/=http[^,]*//g')"
          ssh "deploy@$H" "NAME='$NAME' H='$H' CLUSTER='$CLUSTER' bash -s" <<'REMOTE'
          set -e
          docker run -d --name gul-etcd --restart unless-stopped --network host \
            -v gul-etcd-data:/etcd-data quay.io/coreos/etcd:v3.5.17 etcd \
            --name "$NAME" --data-dir /etcd-data \
            --listen-peer-urls http://0.0.0.0:2380 --listen-client-urls http://0.0.0.0:2379 \
            --initial-advertise-peer-urls "http://$H:2380" --advertise-client-urls "http://$H:2379" \
            --initial-cluster "$CLUSTER" --initial-cluster-state existing \
            --heartbeat-interval 250 --election-timeout 2500 \
            --auto-compaction-retention 1 --quota-backend-bytes 1073741824 >/dev/null
          REMOTE
          sleep 15
          ssh "$PW" "docker exec gul-etcd etcdctl --endpoints=http://$SURV:2379,http://$W:2379,http://$H:2379 endpoint health" < /dev/null

      - name: App files from the survivor (.env, patroni.env, HAProxy configs, compose)
        run: |
          set -e
          umask 077
          scp -q "$PS:$SURV_DIR/.env" node.env
          sed -i "/^REDIS_SENTINELS=/d" node.env
          echo "REDIS_SENTINELS=$SURV:26379,$H:26379,$W:26379" >> node.env
          grep -q '@postgres:5432' node.env || { echo "survivor .env does not use @postgres:5432" >&2; exit 1; }
          scp -q "$PS:$SURV_DIR/patroni.env" patroni.env
          for f in haproxy-pg.cfg haproxy-redis.cfg; do scp -q "$PS:$SURV_DIR/$f" "$f"; sed -i "s/ $DEAD:/ $H:/" "$f"; done
          scp -q node.env "deploy@$H:$DIR/.env"
          scp -q patroni.env haproxy-pg.cfg haproxy-redis.cfg "deploy@$H:$DIR/"
          scp -q "$COMPOSE" "deploy@$H:$DIR/docker-compose.yml"
          ssh "deploy@$H" "chmod 644 $DIR/haproxy-*.cfg" < /dev/null
          # The survivor's routers and Sentinel list follow the new address too.
          ssh "$PS" "cd $SURV_DIR && sed -i 's/ $DEAD:/ $H:/' haproxy-pg.cfg haproxy-redis.cfg && sed -i 's/$DEAD:26379/$H:26379/' .env && docker compose restart postgres redis >/dev/null" < /dev/null
          rm -f node.env patroni.env

      - name: Database -- gul-pg on the new host (Patroni clones it from the leader)
        run: |
          set -e
          ssh "deploy@$H" "DIR='$DIR' NAME='$NAME' H='$H' SURV='$SURV' W='$W' IMAGE='$IMAGE' bash -s" <<'REMOTE'
          set -e
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          docker volume create gul-pg-data >/dev/null
          docker run -d --name gul-pg --restart unless-stopped --network host --stop-timeout 120 \
            --log-driver journald --log-opt tag=gul-pg \
            -v gul-pg-data:/var/lib/postgresql/data --env-file "$DIR/patroni.env" \
            -e NODE_NAME="$NAME" -e NODE_IP="$H" -e ETCD_HOSTS="$SURV:2379,$H:2379,$W:2379" \
            "$IMAGE" >/dev/null
          for i in $(seq 1 120); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8008/replica)" = 200 ] && { echo "replica streaming"; exit 0; }
            sleep 5
          done
          docker logs --tail 40 gul-pg; exit 1
          REMOTE

      - name: Redis -- replica of the current master, Sentinel, forget the dead ones
        run: |
          set -e
          M=$(ssh "$PW" "docker exec gul-sentinel redis-cli -p 26379 sentinel get-master-addr-by-name gul | head -1" < /dev/null)
          [ -n "$M" ] || { echo "Sentinels name no master" >&2; exit 1; }
          ssh "deploy@$H" "DIR='$DIR' H='$H' M='$M' bash -s" <<'REMOTE'
          set -e
          P=$(grep -E '^REDIS_PASSWORD=' "$DIR/.env" | head -1 | cut -d= -f2- | sed -E "s/^[\"'](.*)[\"']\$/\1/")
          docker volume create gul-redis-data >/dev/null
          docker run -d --name gul-redis --restart unless-stopped --network host --log-driver journald --log-opt tag=gul-redis \
            -v gul-redis-data:/data redis:7-alpine --port 6379 --requirepass "$P" --masterauth "$P" --appendonly yes \
            --replica-announce-ip "$H" --replicaof "$M" 6379 >/dev/null
          docker volume create gul-sentinel >/dev/null
          docker run --rm -v gul-sentinel:/conf -e M="$M" -e SELF="$H" -e P="$P" redis:7-alpine sh -c '
            printf "%s\n" "port 26379" "sentinel announce-ip $SELF" "sentinel monitor gul $M 6379 2" "sentinel auth-pass gul $P" \
              "sentinel down-after-milliseconds gul 5000" "sentinel failover-timeout gul 30000" "sentinel parallel-syncs gul 1" > /conf/sentinel.conf'
          docker run -d --name gul-sentinel --restart unless-stopped --network host --log-driver journald --log-opt tag=gul-sentinel \
            -v gul-sentinel:/conf redis:7-alpine redis-sentinel /conf/sentinel.conf >/dev/null
          for i in $(seq 1 60); do
            docker exec gul-redis redis-cli --no-auth-warning -a "$P" info replication | grep -q master_link_status:up && { echo "redis replica in sync"; exit 0; }
            sleep 2
          done
          exit 1
          REMOTE
          for t in "$PS" "$PW" "deploy@$H"; do ssh "$t" "docker exec gul-sentinel redis-cli -p 26379 sentinel reset gul >/dev/null" < /dev/null; done
          sleep 15
          ssh "$PW" "docker exec gul-sentinel redis-cli -p 26379 sentinel ckquorum gul" < /dev/null

      - name: App, nginx and certificates on the new host
        run: |
          set -e
          # Certificates from the survivor (the same wildcard pair both nodes serve).
          ssh "$PS" "docker run --rm -v /etc/ssl/gulyaly:/c:ro -v /tmp:/o alpine sh -c 'tar czf /o/gulcert.tgz -C /c . && chmod 644 /o/gulcert.tgz'" < /dev/null
          scp -q "$PS:/tmp/gulcert.tgz" gulcert.tgz
          ssh "$PS" "rm -f /tmp/gulcert.tgz" < /dev/null
          ssh "deploy@$H" "mkdir -p /tmp/nginx-sync" < /dev/null
          scp -q gulcert.tgz "deploy@$H:/tmp/gulcert.tgz"; rm -f gulcert.tgz
          scp -q infra/nginx/*.conf "deploy@$H:/tmp/nginx-sync/"
          {
            echo '#!/bin/sh'; echo 'set -e'
            echo 'apt-get update -y >/dev/null'
            echo 'curl -fsSL https://nginx.org/keys/nginx_signing.key | gpg --dearmor --yes -o /usr/share/keyrings/nginx-archive-keyring.gpg'
            echo 'echo "deb [signed-by=/usr/share/keyrings/nginx-archive-keyring.gpg] http://nginx.org/packages/mainline/ubuntu $(lsb_release -cs) nginx" > /etc/apt/sources.list.d/nginx.list'
            echo 'apt-get update -y >/dev/null && DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Options::=--force-confnew nginx >/dev/null'
            echo 'mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled /var/www/certbot /var/cache/nginx/gul /etc/ssl/gulyaly'
            echo "echo 'include /etc/nginx/sites-enabled/*;' > /etc/nginx/conf.d/00-sites-enabled.conf"
            echo 'rm -f /etc/nginx/conf.d/default.conf'
            echo "sed -i 's/^user .*/user www-data;/' /etc/nginx/nginx.conf"
            echo 'chown -R www-data:www-data /var/cache/nginx'
            echo 'tar xzf /tmp/gulcert.tgz -C /etc/ssl/gulyaly && chmod 600 /etc/ssl/gulyaly/privkey.pem && rm -f /tmp/gulcert.tgz'
            echo 'cp /tmp/nginx-sync/*.conf /etc/nginx/sites-available/ && rm -rf /tmp/nginx-sync'
            echo 'for f in /etc/nginx/sites-available/*.conf; do ln -sf "$f" "/etc/nginx/sites-enabled/$(basename "$f")"; done'
            echo 'nginx -t && systemctl enable --now nginx && systemctl reload nginx'
          } > ngx.sh
          scp -q ngx.sh "deploy@$H:/tmp/ngx.sh"
          ssh "deploy@$H" "DIR='$DIR' bash -s" <<'REMOTE'
          set -e
          docker run --rm --pid=host --network=host --privileged -v /:/host alpine chroot /host /bin/sh /tmp/ngx.sh
          rm -f /tmp/ngx.sh
          cd "$DIR"
          docker network create gul-net >/dev/null 2>&1 || true
          docker compose pull -q
          docker compose up -d
          for p in 4000 4002 4001; do
            for i in $(seq 1 60); do curl -fsS "http://127.0.0.1:$p/api/health/ready" >/dev/null && break; sleep 3; done
            curl -fsS "http://127.0.0.1:$p/api/health/ready" >/dev/null || { docker compose logs --tail 30 api; exit 1; }
          done
          echo "app healthy"
          REMOTE
          code=$(curl -s -o /dev/null -m 15 --resolve "api.gulyaly.com:443:$H" -w '%{http_code}:%{ssl_verify_result}' https://api.gulyaly.com/api/health/ready)
          echo "new host over HTTPS: $code"
          [ "$code" = "200:0" ]

      - name: Record the new host (secrets)
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GH_TOKEN }}
          KNOWN: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -e
          printf '%s\n' "$KNOWN" | grep -v "^$DEAD " | grep -v "^$H " > kh
          echo "$HOSTKEY_LINE" >> kh
          gh secret set SSH_KNOWN_HOSTS --repo "${{ github.repository }}" < kh
          printf '%s' "$H" | gh secret set "$HOST_SECRET" --repo "${{ github.repository }}"
          rm -f kh
          # FENCED_HOST tells the witness which cut-off machine to watch for: when it answers again it
          # is rebuilt in place (fresh copy of the database, nothing stale kept) and the auto-bought
          # stand-in goes. A rebuild onto a given host (use_host) closes that loop.
          if [ -z "${{ inputs.use_host }}" ]; then
            printf '%s' "$ROLE:$DEAD" | gh secret set FENCED_HOST --repo "${{ github.repository }}"
          else
            printf '%s' "none" | gh secret set FENCED_HOST --repo "${{ github.repository }}"
          fi
          echo "$HOST_SECRET, SSH_KNOWN_HOSTS and FENCED_HOST updated"

      - name: DNS -- dead address out, new host in
        run: |
          set -e
          api() { curl -s -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" "$@"; }
          ids() { api "https://api.timeweb.cloud/api/v1/domains/$1/dns-records" | jq -r --arg ip "$2" '.dns_records[]? | select(.type == "A" and .data.value == $ip) | .id'; }
          names="gulyaly.com api.gulyaly.com www.gulyaly.com"
          [ "$ROLE" = primary ] && names="$names admin.gulyaly.com"
          for f in $names; do
            [ -n "$(ids "$f" "$H")" ] || api -X POST "https://api.timeweb.cloud/api/v2/domains/$f/dns-records" -d "{\"type\": \"A\", \"value\": \"$H\", \"ttl\": 60}" >/dev/null               || { echo "could not add $f -> new host" >&2; exit 1; }
            # Apex records delete by the apex path, subdomain ones by their own fqdn: one of the two
            # answers 404, which is expected.
            for id in $(ids "$f" "$DEAD"); do
              api -X DELETE "https://api.timeweb.cloud/api/v2/domains/gulyaly.com/dns-records/$id" >/dev/null 2>&1 || true
              [ "$f" = gulyaly.com ] || api -X DELETE "https://api.timeweb.cloud/api/v2/domains/$f/dns-records/$id" >/dev/null 2>&1 || true
            done
            [ -z "$(ids "$f" "$DEAD")" ] || { echo "$f still points at the dead address" >&2; exit 1; }
            echo "$f: new host in, dead address out"
          done

      - name: Self-heal, backups and the witness follow the new secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for w in install-watchdog.yml install-db-backup-s3.yml install-witness-watch.yml; do
            gh workflow run "$w" --repo "${{ github.repository }}" && echo "dispatched $w"
          done

      - name: Retire the auto-bought stand-in this run replaced (failback)
        if: inputs.use_host != ''
        run: |
          set -e
          api() { curl -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" "$@"; }
          sid=$(api https://api.timeweb.cloud/api/v1/servers | jq -r --arg ip "$DEAD" '.servers[]
            | select(.name | startswith("gul-auto-"))
            | select([.networks[]? | select(.type == "public") | .ips[]? | .ip] | index($ip))
            | .id' | head -1)
          if [ -z "$sid" ]; then echo "the replaced host is not an auto-bought Timeweb server -- nothing to delete"; exit 0; fi
          api -X DELETE "https://api.timeweb.cloud/api/v1/servers/$sid" >/dev/null || true
          for i in $(seq 1 30); do
            [ "$(curl -q -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "https://api.timeweb.cloud/api/v1/servers/$sid")" = 404 ] && break; sleep 10
          done
          # Timeweb keeps the separately billed IPv4 after the server is gone.
          for id in $( (api https://api.timeweb.cloud/api/v1/floating-ips || echo '{}') | jq -r --arg ip "$DEAD" '.ips[]? | select(.ip == $ip) | .id'); do
            api -X DELETE "https://api.timeweb.cloud/api/v1/floating-ips/$id" >/dev/null || true
          done
          echo "RETIRED=1" >> "$GITHUB_ENV"
          echo "auto-bought server $sid and its IPv4 deleted"

      - name: Report
        if: always()
        run: |
          if [ "${{ job.status }}" = success ] && [ -n "${{ inputs.use_host }}" ]; then
            tg "✅ Gulyaly: старый сервер (роль $ROLE) снова в работе со свежей копией базы.$( [ -n "${RETIRED:-}" ] && echo ' Временный сервер Timeweb удалён вместе с IP.')"
          elif [ "${{ job.status }}" = success ]; then
            tg "✅ Gulyaly: замена готова. Роль $ROLE теперь на новом сервере (gul-auto-*), база и Redis скопированы, DNS обновлён. Старый сервер отрезан файрволом; когда он оживёт, его автоматически вернут со свежей копией базы, а временный удалят."
          else
            tg "❌ Gulyaly: автозамена роли $ROLE не завершилась — сайт работает на оставшемся сервере. Подробности: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
