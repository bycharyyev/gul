name: Prepare secondary for failover

# Safe to run any time, non-disruptive to the running standby or to production: attaches the
# already-running pg-standby replica to a shared docker network (live, no restart), copies the
# current .env + TLS certs + nginx vhosts from primary onto the secondary so nginx there is
# already serving the right certs, and re-points the copied .env at primary's database over the
# network (this node runs active/active against primary's DB day-to-day -- see
# enable-active-active.yml). Run this again any time primary's secrets or certs change, to keep
# the secondary in sync. Does NOT promote the replica or touch DNS -- that's
# failover-to-secondary.yml, deliberately separate since promoting ends replication and isn't
# something to fire by accident.

on:
  workflow_dispatch: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan -H "${{ secrets.SECONDARY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Attach pg-standby to a shared network aliased "postgres" (live, no restart)
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}" '
            docker network create gul-net >/dev/null 2>&1 || true
            # Pre-Patroni only: the bare replica answered as "postgres" on gul-net.
            docker ps --format '{{.Names}}' | grep -qx pg-standby && docker network connect gul-net pg-standby --alias postgres >/dev/null 2>&1 || true
            docker network inspect gul-net --format "{{range .Containers}}{{.Name}} {{end}}"
          ' < /dev/null

      - name: Pack primary .env + TLS certs, pull to runner
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            docker run --rm -v /etc/letsencrypt:/letsencrypt:ro -v /tmp:/out alpine \
              sh -c "tar czf /out/le.tar.gz -C / letsencrypt && chown $(id -u):$(id -g) /out/le.tar.gz"
          ' < /dev/null
          scp -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/le.tar.gz" ./le.tar.gz
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'rm -f /tmp/le.tar.gz' < /dev/null
          scp -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/gul/.env" ./primary.env

      - name: Ship certs, .env, compose file and nginx vhosts to the secondary
        # /opt/gul-secondary is root-owned territory: on a rebuilt box it does not exist yet and
        # `deploy` cannot create it, which is where a from-scratch rebuild first falls over
        # (2026-09-05). Create it via the docker-chroot root trick first, then everything below
        # runs as `deploy` against a directory it owns.
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}" bash -s <<'REMOTE'
            set -e
            if [ ! -d /opt/gul-secondary ]; then
              printf '%s\n' '#!/bin/sh' 'set -e' 'mkdir -p /opt/gul-secondary' 'chown -R deploy:deploy /opt/gul-secondary' > /tmp/mkdir-app.sh
              docker run --rm --pid=host --privileged -v /:/host alpine chroot /host /bin/sh /tmp/mkdir-app.sh
              rm -f /tmp/mkdir-app.sh
            fi
            mkdir -p /tmp/nginx-sync
          REMOTE
          scp -i ~/.ssh/id_ed25519 ./le.tar.gz "${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}:/tmp/le.tar.gz"
          scp -i ~/.ssh/id_ed25519 ./primary.env "${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}:/opt/gul-secondary/.env"
          scp -i ~/.ssh/id_ed25519 docker-compose.secondary.yml "${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}:/opt/gul-secondary/docker-compose.yml"
          scp -i ~/.ssh/id_ed25519 infra/nginx/*.conf "${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}:/tmp/nginx-sync/"
          rm -f ./le.tar.gz ./primary.env

      - name: Re-point the freshly-copied .env at primary's DB over the network (active/active mode)
        # This file is a raw copy of primary's own .env, whose DATABASE_URL says host "postgres"
        # (its own docker-compose service name). Left as-is, the secondary's api would try the
        # local pg-standby -- a read-only replica -- and every write would fail. Keep this in sync
        # with enable-active-active.yml's own rewrite so a re-run of either doesn't fight the other.
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}" \
            "PRIMARY_IP='${{ secrets.DEPLOY_HOST }}' bash -s" <<'REMOTE'
            set -e
            # Since Patroni, DATABASE_URL stays @postgres:5432 -- the local HAProxy finds the
            # leader. The rewrite to the primary's address only applies on a pre-Patroni node.
            if ! docker ps --format '{{.Names}}' | grep -qx gul-pg; then
              sed -i "s#@postgres:5432#@$PRIMARY_IP:5432#" /opt/gul-secondary/.env
            fi
            if grep -q '^PRIMARY_REDIS_HOST=' /opt/gul-secondary/.env; then
              sed -i "s/^PRIMARY_REDIS_HOST=.*/PRIMARY_REDIS_HOST=$PRIMARY_IP/" /opt/gul-secondary/.env
            else
              echo "PRIMARY_REDIS_HOST=$PRIMARY_IP" >> /opt/gul-secondary/.env
            fi
          REMOTE

      - name: Install nginx/certbot, certs, vhosts; start nginx (idle until DNS points here)
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}" \
            "GHCR_OWNER='${{ github.repository_owner }}' bash -s" <<'REMOTE'
            set -e
            {
              echo "#!/bin/sh"
              echo "set -e"
              echo "command -v nginx >/dev/null 2>&1 || (apt-get update -y && apt-get install -y nginx certbot)"
              # The vhosts use the standalone 'http2 on;' directive (nginx >= 1.25.1). Ubuntu 24.04
              # ships 1.24, which rejects it. Launchpad PPAs were unreachable from the Timeweb host,
              # so nginx.org's own repo; its layout lacks Debian's sites-enabled include and runs as
              # 'nginx', so both are put back to match the primary. A no-op where nginx is new enough.
              echo "if ! nginx -v 2>&1 | awk -F/ '{split(\$2,v,\".\"); exit !(v[1]>1 || (v[1]==1 && v[2]>25) || (v[1]==1 && v[2]==25 && v[3]>=1))}'; then"
              echo "  curl -fsSL https://nginx.org/keys/nginx_signing.key | gpg --dearmor --yes -o /usr/share/keyrings/nginx-archive-keyring.gpg"
              echo "  echo \"deb [signed-by=/usr/share/keyrings/nginx-archive-keyring.gpg] http://nginx.org/packages/mainline/ubuntu \$(lsb_release -cs) nginx\" > /etc/apt/sources.list.d/nginx.list"
              echo "  apt-get update -y"
              echo "  DEBIAN_FRONTEND=noninteractive apt-get remove -y nginx nginx-common || true"
              echo "  DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Options::=--force-confnew nginx"
              echo "  mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled"
              echo "  echo 'include /etc/nginx/sites-enabled/*;' > /etc/nginx/conf.d/00-sites-enabled.conf"
              echo "  rm -f /etc/nginx/conf.d/default.conf"
              echo "  sed -i 's/^user .*/user www-data;/' /etc/nginx/nginx.conf"
              echo "  systemctl enable nginx"
              echo "fi"
              echo "nginx -v"
              echo "tar xzf /tmp/le.tar.gz -C /etc"
              echo "rm -f /tmp/le.tar.gz"
              echo "mkdir -p /var/www/certbot"
              # gulyaly-cache.conf declares proxy_cache_path here; nginx -t fails outright if the
              # directory is missing, which is the second thing a from-scratch rebuild trips on.
              echo "mkdir -p /var/cache/nginx/gul"
              echo "chown -R www-data:www-data /var/cache/nginx"
              echo "sed -i 's/^authenticator = .*/authenticator = webroot/' /etc/letsencrypt/renewal/gulyaly.com.conf 2>/dev/null || true"
              echo "grep -q '^webroot_path' /etc/letsencrypt/renewal/gulyaly.com.conf 2>/dev/null || echo 'webroot_path = /var/www/certbot,' >> /etc/letsencrypt/renewal/gulyaly.com.conf"
              echo "sed -i '/^installer = /d' /etc/letsencrypt/renewal/gulyaly.com.conf 2>/dev/null || true"
              echo "cp /tmp/nginx-sync/*.conf /etc/nginx/sites-available/"
              echo "for f in /etc/nginx/sites-available/*.conf; do ln -sf \"\$f\" \"/etc/nginx/sites-enabled/\$(basename \"\$f\")\"; done"
              echo "rm -f /etc/nginx/sites-enabled/default"
              echo "rm -rf /tmp/nginx-sync"
              echo "nginx -t"
              echo "systemctl enable --now nginx"
              echo "systemctl reload nginx"
              echo "grep -q '^GHCR_OWNER=' /opt/gul-secondary/.env || echo GHCR_OWNER=$GHCR_OWNER >> /opt/gul-secondary/.env"
              echo "echo prepared"
            } > /tmp/prep.sh
            chmod +x /tmp/prep.sh
            # --network=host: apt-get inside the chroot resolves through the host's systemd-resolved
            # stub (127.0.0.53), which only exists in the host network namespace. Without it a fresh
            # host (nginx not yet installed) failed every download with "Temporary failure resolving".
            docker run --rm --pid=host --network=host --privileged -v /:/host alpine chroot /host /bin/sh /tmp/prep.sh
            rm -f /tmp/prep.sh
          REMOTE
