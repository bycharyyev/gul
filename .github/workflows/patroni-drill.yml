name: HA drills (Patroni, Redis, whole data tier) / switchover

# drill:      stops the leader's gul-pg (as if the node lost its database), proves the other node
#             takes over on its own and the site answers on BOTH nodes through HAProxy, then starts
#             the stopped member again and proves it rejoins as a replica. Measures the gap.
# switchover: planned, clean move of the leader to `candidate` (e.g. back to gul-a after a drill).
# redis-drill: stops the redis master, proves the Sentinels promote the replica and the site answers
#             on both nodes, starts it again (it rejoins as a replica), then fails back to the primary.
# node-drill: stops BOTH gul-pg and gul-redis on the primary at once (its whole data tier), proves
#             the secondary carries the site alone, then restores and moves both leaders back.
# app-drill:  stops nginx on the secondary (as if that node fell off the network -- stopping the API
#             is not enough: gul-watchdog brings a dead API back within 30 s), measures how long
#             until the witness + watchdog take it out of DNS, then restores it and measures the return.
# status:     patronictl list + redis roles, read-only.

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [status, drill, switchover, redis-drill, node-drill, app-drill]
        default: status
      candidate:
        description: 'switchover only: gul-a or gul-b'
        default: 'gul-a'

jobs:
  run:
    runs-on: ubuntu-latest
    # Needs the owner's approval click (GitHub environment "danger"): see watchdog.yml for why.
    environment: danger
    timeout-minutes: 20
    env:
      A: ${{ secrets.DEPLOY_HOST }}
      B: ${{ secrets.SECONDARY_HOST }}
      PA: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      PB: ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}
      PW: ${{ secrets.WITNESS_USER }}@${{ secrets.WITNESS_HOST }}
    steps:
      - name: Set up SSH (pinned host keys)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf '%s\n' 'Host *' '  IdentityFile ~/.ssh/deploy_key' '  ServerAliveInterval 15' > ~/.ssh/config

      - name: Status
        run: |
          ssh "$PA" "docker exec gul-pg patronictl -c /tmp/patroni.yml list" < /dev/null
          m=$(ssh "$PW" "docker exec gul-sentinel redis-cli -p 26379 sentinel get-master-addr-by-name gul 2>/dev/null | head -1" < /dev/null || true)
          if [ "$m" = "$A" ]; then echo "redis master: primary"; elif [ "$m" = "$B" ]; then echo "redis master: secondary"; else echo "redis master: unknown (no Sentinel yet?)"; fi

      - name: Switchover
        if: inputs.action == 'switchover'
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          set -e
          # Unsafe REST calls need the API password (entrypoint.sh: user patroni, REPLICATOR_PASSWORD).
          ssh "$PA" "docker exec -e CANDIDATE='$CANDIDATE' gul-pg sh -c 'PATRONI_CTL_USERNAME=patroni PATRONI_CTL_PASSWORD=\"\$REPLICATOR_PASSWORD\" patronictl -c /tmp/patroni.yml switchover gul --candidate \"\$CANDIDATE\" --force'" < /dev/null
          sleep 15
          ssh "$PA" "docker exec gul-pg patronictl -c /tmp/patroni.yml list" < /dev/null

      - name: Drill -- kill the leader's database, measure, bring it back
        if: inputs.action == 'drill'
        run: |
          set -e
          site() { # site <ip> -> http code of /api/health/ready (app + database) on that node
            curl -s -o /dev/null -m 8 --resolve "api.gulyaly.com:443:$1" -w '%{http_code}' https://api.gulyaly.com/api/health/ready || true
          }
          # The runner cannot reach :8008 (firewalled), so ask the nodes themselves.
          if ssh "$PA" "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8008/primary" < /dev/null | grep -qx 200; then
            LEAD="$PA"; OTHER="$PB"
          else
            LEAD="$PB"; OTHER="$PA"
          fi
          echo "stopping gul-pg on the current leader"
          t0=$(date +%s)
          ssh "$LEAD" "docker stop -t 30 gul-pg >/dev/null" < /dev/null
          for i in $(seq 1 60); do
            code=$(ssh "$OTHER" "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8008/primary" < /dev/null || true)
            [ "$code" = 200 ] && break
            sleep 2
          done
          [ "$code" = 200 ] || { echo "the other node did NOT take over" >&2; exit 1; }
          echo "new leader after $(( $(date +%s) - t0 )) s"
          for i in $(seq 1 30); do
            a=$(site "$A"); b=$(site "$B")
            [ "$a" = 200 ] && [ "$b" = 200 ] && break
            sleep 2
          done
          echo "site through both nodes: $a / $b, $(( $(date +%s) - t0 )) s after the stop"
          [ "$a" = 200 ] && [ "$b" = 200 ]
          echo "starting the old leader again"
          ssh "$LEAD" "docker start gul-pg >/dev/null" < /dev/null
          for i in $(seq 1 60); do
            code=$(ssh "$LEAD" "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8008/replica" < /dev/null || true)
            [ "$code" = 200 ] && break
            sleep 3
          done
          [ "$code" = 200 ] || { echo "the old leader did not rejoin as a replica" >&2; exit 1; }
          echo "old leader rejoined as a replica"
          sleep 10
          ssh "$OTHER" "docker exec gul-pg patronictl -c /tmp/patroni.yml list" < /dev/null

      - name: Redis / node drill
        if: inputs.action == 'redis-drill' || inputs.action == 'node-drill'
        env:
          MODE: ${{ inputs.action }}
        run: |
          set -e
          site() { curl -s -o /dev/null -m 8 --resolve "api.gulyaly.com:443:$1" -w '%{http_code}' https://api.gulyaly.com/api/health/ready || true; }
          sen() { ssh "$PW" "docker exec gul-sentinel redis-cli -p 26379 $*" < /dev/null; }
          master() { sen sentinel get-master-addr-by-name gul | head -1; }
          if [ "$(master)" = "$A" ]; then LEAD="$PA"; OTHER="$PB"; NEWIP="$B"; else LEAD="$PB"; OTHER="$PA"; NEWIP="$A"; fi
          t0=$(date +%s)
          if [ "$MODE" = node-drill ]; then
            echo "stopping the data tier (gul-pg + gul-redis) on the redis master's node"
            ssh "$LEAD" "docker stop -t 20 gul-redis gul-pg >/dev/null" < /dev/null
          else
            echo "stopping gul-redis on the master"
            ssh "$LEAD" "docker stop -t 20 gul-redis >/dev/null" < /dev/null
          fi
          for i in $(seq 1 45); do [ "$(master)" = "$NEWIP" ] && break; sleep 2; done
          [ "$(master)" = "$NEWIP" ] || { echo "Sentinels did NOT promote the replica" >&2; exit 1; }
          echo "new redis master after $(( $(date +%s) - t0 )) s"
          for i in $(seq 1 40); do
            a=$(site "$A"); b=$(site "$B")
            [ "$a" = 200 ] && [ "$b" = 200 ] && break
            sleep 2
          done
          echo "site through both nodes: $a / $b, $(( $(date +%s) - t0 )) s after the stop"
          [ "$a" = 200 ] && [ "$b" = 200 ]
          echo "starting the stopped containers again"
          ssh "$LEAD" "docker start gul-pg gul-redis >/dev/null 2>&1 || docker start gul-redis >/dev/null" < /dev/null
          sleep 25
          sen sentinel replicas gul | grep -A1 -E '^flags$' | grep -v -- -- || true
          echo "failing back: redis master and Patroni leader to the primary"
          [ "$(master)" = "$A" ] || { sen sentinel failover gul; for i in $(seq 1 30); do [ "$(master)" = "$A" ] && break; sleep 2; done; }
          [ "$(master)" = "$A" ] && echo "redis master is the primary again"
          if ! ssh "$PA" "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8008/primary" < /dev/null | grep -qx 200; then
            for i in $(seq 1 30); do
              ssh "$PA" "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8008/replica" < /dev/null | grep -qx 200 && break; sleep 3
            done
            ssh "$PA" "docker exec gul-pg sh -c 'PATRONI_CTL_USERNAME=patroni PATRONI_CTL_PASSWORD=\"\$REPLICATOR_PASSWORD\" patronictl -c /tmp/patroni.yml switchover gul --candidate gul-a --force'" < /dev/null
          fi
          sleep 15
          ssh "$PA" "docker exec gul-pg patronictl -c /tmp/patroni.yml list" < /dev/null
          echo "final: site $(site "$A") / $(site "$B")"

      - name: App drill -- secondary API down, DNS follows
        if: inputs.action == 'app-drill'
        run: |
          set -e
          sudo apt-get install -y -qq dnsutils >/dev/null 2>&1 || true
          in_dns() { dig +short @ns1.timeweb.ru api.gulyaly.com A | grep -qx "$B"; }
          in_dns || { echo "the secondary is not in DNS to begin with" >&2; exit 1; }
          t0=$(date +%s)
          nginx_ctl() { # nginx_ctl stop|start on the secondary (host systemd, via the docker-chroot trick)
            ssh "$PB" "echo 'systemctl $1 nginx' > /tmp/ng.sh && docker run --rm --pid=host --privileged -v /:/host alpine chroot /host /bin/sh /tmp/ng.sh; rm -f /tmp/ng.sh" < /dev/null
          }
          nginx_ctl stop
          echo "secondary nginx stopped; as a visitor sees it now: $(curl -s -o /dev/null -m 8 --resolve "api.gulyaly.com:443:$B" -w '%{http_code}' https://api.gulyaly.com/api/health/ready)"
          for i in $(seq 1 60); do in_dns || break; sleep 10; done
          in_dns && { echo "still in DNS after 10 min" >&2; nginx_ctl start; exit 1; }
          echo "removed from DNS $(( $(date +%s) - t0 )) s after the stop"
          t1=$(date +%s)
          nginx_ctl start
          echo "secondary nginx started"
          for i in $(seq 1 60); do in_dns && break; sleep 10; done
          in_dns || { echo "not back in DNS after 10 min" >&2; exit 1; }
          echo "back in DNS $(( $(date +%s) - t1 )) s after the start"
