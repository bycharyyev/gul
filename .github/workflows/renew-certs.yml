name: Renew the gulyaly.com and gulyaly.pro certificates (DNS-01) on both hosts

# Why this exists: DNS round-robins gulyaly.com/www/api across BOTH hosts, so an HTTP-01
# challenge lands on whichever node the validator happens to resolve -- and the token only exists
# on the node running certbot. Renewal on the hosts was therefore a coin toss per validation
# perspective, and the secondary's certificate was a one-off copy nothing refreshed: the
# 2026-12-17 expiry would have taken half (or all) of HTTPS down.
#
# Instead the certificates are issued HERE, on the runner, with a DNS-01 challenge published
# through the Timeweb API (infra/ssl/dns01/), and installed on both hosts. Two separate
# certificates, one per domain (2026-11-18: gulyaly.pro became a full second site, not a redirect):
#   gulyaly      gulyaly.com + *.gulyaly.com   -> /etc/ssl/gulyaly/
#   gulyaly-pro  gulyaly.pro + *.gulyaly.pro   -> /etc/ssl/gulyaly-pro/
# Neither host takes part in validation, so round-robin no longer matters. Each wildcard also
# covers its domain's subdomains. Details and recovery: infra/ssl/README.md.
#
# Weekly; each certificate renews only when fewer than RENEW_DAYS remain (Let's Encrypt certs last
# 90 days), so four or more attempts happen before an expiry. A failed scheduled run emails the
# repo owner.

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Renew even if the installed certificates are not due"
        type: boolean
        default: false
      staging:
        description: "Use the Let's Encrypt STAGING CA: proves the DNS-01 automation, installs nothing"
        type: boolean
        default: false

concurrency:
  group: certs
  cancel-in-progress: false

env:
  RENEW_DAYS: "30"
  # <certbot cert-name, also the directory under /etc/ssl>:<domain>; each gets <domain> + *.<domain>
  CERTS: "gulyaly:gulyaly.com gulyaly-pro:gulyaly.pro"

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH (pinned host keys)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Decide which certificates are due
        id: due
        run: |
          forced=false
          if [ "${{ inputs.staging }}" = "true" ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "Forced (staging=${{ inputs.staging }}, force=${{ inputs.force }})."; forced=true
          fi
          list=""
          for cert in $CERTS; do
            name=${cert%%:*}; domain=${cert#*:}
            due=$forced
            for target in "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" $([ "${{ vars.SECONDARY_ENABLED }}" = "true" ] && echo "${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}"); do
              [ "$due" = true ] && break
              f=/etc/ssl/$name/fullchain.pem
              end=$(ssh -i ~/.ssh/deploy_key "$target" "openssl x509 -enddate -noout -in $f 2>/dev/null" < /dev/null | cut -d= -f2)
              if [ -z "$end" ]; then
                echo "$name: no certificate at $f on a host -- issuing"; due=true; continue
              fi
              days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
              echo "$name: installed certificate expires $end ($days days left)"
              [ "$days" -lt "$RENEW_DAYS" ] && due=true
              # A name added to CERTS must not wait for the next expiry to be covered.
              sans=$(ssh -i ~/.ssh/deploy_key "$target" "openssl x509 -noout -ext subjectAltName -in $f 2>/dev/null" < /dev/null)
              for n in "$domain" "*.$domain"; do
                grep -qF "DNS:$n" <<<"$sans" || { echo "$name: does not cover $n -- reissuing"; due=true; }
              done
            done
            [ "$due" = true ] && list="$list $cert"
          done
          echo "due:${list:- none}"
          echo "list=${list# }" >> "$GITHUB_OUTPUT"

      - name: Install certbot
        if: steps.due.outputs.list != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq certbot dnsutils jq > /dev/null && certbot --version

      - name: Issue the due certificates via DNS-01
        if: steps.due.outputs.list != ''
        env:
          TIMEWEB_API_TOKEN: ${{ secrets.TIMEWEB_API_TOKEN }}
          LIST: ${{ steps.due.outputs.list }}
        run: |
          chmod +x infra/ssl/dns01/*.sh
          LE="$RUNNER_TEMP/le"
          for cert in $LIST; do
            name=${cert%%:*}; domain=${cert#*:}
            certbot certonly --non-interactive --agree-tos -m malobiznes@gmail.com \
              --config-dir "$LE/config" --work-dir "$LE/work" --logs-dir "$LE/logs" \
              --manual --preferred-challenges dns \
              --manual-auth-hook "$GITHUB_WORKSPACE/infra/ssl/dns01/timeweb-auth.sh" \
              --manual-cleanup-hook "$GITHUB_WORKSPACE/infra/ssl/dns01/timeweb-cleanup.sh" \
              --cert-name "$name" --key-type ecdsa \
              ${{ inputs.staging && '--staging' || '' }} \
              -d "$domain" -d "*.$domain"
            openssl x509 -in "$LE/config/live/$name/fullchain.pem" -noout -issuer -enddate -ext subjectAltName
          done

      - name: Install on both hosts and reload nginx
        if: steps.due.outputs.list != '' && !inputs.staging
        env:
          LIST: ${{ steps.due.outputs.list }}
        run: |
          umask 077
          install_on() {
            ssh -i ~/.ssh/deploy_key "$1" "rm -rf /tmp/cert-install && mkdir -m 700 /tmp/cert-install" < /dev/null
            scp -q -i ~/.ssh/deploy_key /tmp/cert-install/* "$1:/tmp/cert-install/"
            ssh -i ~/.ssh/deploy_key "$1" \
              "docker run --rm --pid=host --privileged -v /:/host alpine chroot /host /bin/sh /tmp/cert-install/apply.sh" < /dev/null
          }

          # Root on the host via the docker-group chroot trick (see the devops skill). Swapped in
          # with mv so nginx never reads a half-written file; nginx -t refuses a key that does not
          # match the certificate before anything is reloaded. Reloads only once a vhost actually
          # points at the directory -- until then this just stages the files.
          cat > "$RUNNER_TEMP/apply-body.sh" <<'SCRIPT'
          install -d -m 755 "$D"
          install -m 644 /tmp/cert-install/fullchain.pem "$D/fullchain.pem.new"
          install -m 600 /tmp/cert-install/privkey.pem "$D/privkey.pem.new"
          mv -f "$D/fullchain.pem.new" "$D/fullchain.pem"
          mv -f "$D/privkey.pem.new" "$D/privkey.pem"
          rm -rf /tmp/cert-install
          # -R, not -r: sites-enabled holds symlinks, which -r does not follow -- so this said
          # "staged only" and never reloaded (2026-11-18: new certificate on disk, old one served).
          if grep -Rqs "$D/" /etc/nginx/sites-enabled/; then
            nginx -t && systemctl reload nginx && echo "nginx reloaded"
          else
            echo "staged only: no vhost references $D yet"
          fi
          SCRIPT

          for cert in $LIST; do
            name=${cert%%:*}
            LIVE="$RUNNER_TEMP/le/config/live/$name"
            rm -rf /tmp/cert-install && mkdir -p /tmp/cert-install
            cp -L "$LIVE/fullchain.pem" "$LIVE/privkey.pem" /tmp/cert-install/
            { echo 'set -e'; echo "D=/etc/ssl/$name"; cat "$RUNNER_TEMP/apply-body.sh"; } > /tmp/cert-install/apply.sh

            install_on "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
            if [ "${{ vars.SECONDARY_ENABLED }}" = "true" ]; then
              install_on "${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}"
            fi
            echo "$name installed"
          done
          rm -rf /tmp/cert-install

      - name: Verify both hosts
        if: steps.due.outputs.list != '' && !inputs.staging
        run: |
          for target in "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" $([ "${{ vars.SECONDARY_ENABLED }}" = "true" ] && echo "${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}"); do
            echo "--- $( [ "$target" = "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" ] && echo primary || echo secondary ) ---"
            for cert in $CERTS; do
              name=${cert%%:*}; domain=${cert#*:}
              ssh -i ~/.ssh/deploy_key "$target" \
                "echo '== $name'; openssl x509 -in /etc/ssl/$name/fullchain.pem -noout -enddate -ext subjectAltName 2>/dev/null; \
                 echo 'served for $domain:'; echo | openssl s_client -connect 127.0.0.1:443 -servername $domain 2>/dev/null | openssl x509 -noout -enddate -ext subjectAltName" < /dev/null
            done
          done
