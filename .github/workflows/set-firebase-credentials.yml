name: Set Firebase push credentials on both hosts

# Writes FIREBASE_PROJECT_ID and FIREBASE_SERVICE_ACCOUNT_BASE64 into /opt/gul/.env and
# /opt/gul-secondary/.env, then recreates the api container on each node.
#
# The service-account JSON is never committed and never passed as a workflow input (inputs are
# visible in the run page). It comes from the repository secret FIREBASE_SERVICE_ACCOUNT_BASE64,
# which the owner creates from the downloaded key on their own machine:
#
#   PowerShell:  [Convert]::ToBase64String([IO.File]::ReadAllBytes("<key>.json")) | gh secret set FIREBASE_SERVICE_ACCOUNT_BASE64
#
# Safe to re-run: it writes fixed values and prints only whether push came up, never the value.

on:
  workflow_dispatch:

jobs:
  set:
    runs-on: ubuntu-latest
    env:
      SA_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
    steps:
      - name: Require the secret
        run: |
          test -n "$SA_BASE64" || { echo "FIREBASE_SERVICE_ACCOUNT_BASE64 secret is not set" >&2; exit 1; }
          echo "::add-mask::$SA_BASE64"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan -H "${{ secrets.SECONDARY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Write the values and recreate api on both hosts
        run: |
          cat > /tmp/set-firebase.sh <<'SCRIPT'
          set -e
          cd "$1"
          set_kv() {
            if grep -q "^$1=" .env; then
              sed -i "s#^$1=.*#$1=\"$2\"#" .env
            else
              echo "$1=\"$2\"" >> .env
            fi
          }
          set_kv FIREBASE_PROJECT_ID "gulyaly-push-20260920"
          set_kv FIREBASE_SERVICE_ACCOUNT_BASE64 "__SA_PLACEHOLDER__"
          for attempt in 1 2 3; do
            docker compose up -d --force-recreate --no-deps api && break
            sleep $((attempt * 10))
          done
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:4000/api/health/ready > /dev/null && echo "healthy: $1" && break
            sleep 2
            [ "$i" = "90" ] && { echo "did NOT come back healthy: $1" >&2; exit 1; }
          done
          if docker compose logs api --tail=300 2>/dev/null | grep -q "Push delivery disabled"; then
            echo "PUSH DISABLED on $1 (credentials missing or unreadable)"
          else
            echo "push enabled on $1"
          fi
          SCRIPT
          sed -i "s#__SA_PLACEHOLDER__#$SA_BASE64#" /tmp/set-firebase.sh

          scp -i ~/.ssh/id_ed25519 /tmp/set-firebase.sh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/set-firebase.sh"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "bash /tmp/set-firebase.sh /opt/gul; s=\$?; rm -f /tmp/set-firebase.sh; exit \$s" < /dev/null

          scp -i ~/.ssh/id_ed25519 /tmp/set-firebase.sh "${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}:/tmp/set-firebase.sh"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}" \
            "bash /tmp/set-firebase.sh /opt/gul-secondary; s=\$?; rm -f /tmp/set-firebase.sh; exit \$s" < /dev/null
          rm -f /tmp/set-firebase.sh
