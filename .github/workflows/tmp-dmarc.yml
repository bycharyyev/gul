name: tmp dmarc
on:
  workflow_dispatch:
jobs:
  dmarc:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.TIMEWEB_API_TOKEN }}
    steps:
      - name: Add DMARC reporting (rua) and strict alignment
        run: |
          LIST=$(curl -s "https://api.timeweb.cloud/api/v1/domains/gulyaly.com/dns-records" -H "Authorization: Bearer $T")
          echo "$LIST" | jq -r '.dns_records[]|select(.data.subdomain=="_dmarc" or (.fqdn // "" | startswith("_dmarc")))|"\(.id) \(.fqdn) \(.data.value)"'
          ID=$(echo "$LIST" | jq -r '[.dns_records[]|select((.fqdn // "" | startswith("_dmarc")) or .data.subdomain=="_dmarc")|.id][0]')
          echo "dmarc id: $ID"
          curl -s -X PATCH "https://api.timeweb.cloud/api/v2/domains/_dmarc.gulyaly.com/dns-records/$ID" -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
            -d '{"type":"TXT","value":"v=DMARC1; p=none; rua=mailto:support@gulyaly.com; adkim=s; aspf=s; fo=1"}' | cut -c1-240; echo
