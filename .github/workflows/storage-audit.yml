name: Storage audit (read-only, one-off)

# One-off: where the disk space goes on each node (volumes, images, journal). Deleted after reading.

on:
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PA: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      PB: ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}
    steps:
      - name: Read
        shell: bash {0}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/k && chmod 600 ~/.ssh/k
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          echo "" | base64 -d > st.sh
          for t in "$PA" "$PB"; do
            echo "================ $t"
            scp -q -i ~/.ssh/k st.sh "$t:/tmp/st.sh"
            ssh -i ~/.ssh/k -o BatchMode=yes "$t" "docker run --rm --pid=host --network=host --privileged -v /:/host alpine chroot /host /bin/sh /tmp/st.sh; rm -f /tmp/st.sh" < /dev/null
          done
