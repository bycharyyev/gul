name: Storage audit (read-only, one-off)

# One-off: where the disk space goes on each node (volumes, images, WAL, logs). Deleted after reading.

on:
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PA: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      PB: ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}
    steps:
      - name: Read
        shell: bash {0}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/k && chmod 600 ~/.ssh/k
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          s() { ssh -i ~/.ssh/k -o ConnectTimeout=10 -o BatchMode=yes "$1" "docker run --rm --pid=host --network=host --privileged -v /:/host alpine chroot /host /bin/sh -c '$2'" < /dev/null; }
          for t in "$PA" "$PB"; do
            echo "================ $t"
            s "$t" "df -h / | tail -1; echo; echo '-- top dirs under /var:'; du -xh --max-depth=2 /var 2>/dev/null | sort -rh | head -12; echo; echo '-- top dirs under /opt:'; du -xh --max-depth=2 /opt 2>/dev/null | sort -rh | head -10; echo; echo '-- docker system df:'; docker system df 2>/dev/null; echo; echo '-- volumes:'; docker volume ls -q | while read v; do echo \"\$(du -sh /var/lib/docker/volumes/\$v/_data 2>/dev/null | cut -f1)  \$v\"; done | sort -rh | head -20; echo; echo '-- journal:'; journalctl --disk-usage 2>/dev/null; echo '-- apt cache:'; du -sh /var/cache/apt 2>/dev/null"
          done
