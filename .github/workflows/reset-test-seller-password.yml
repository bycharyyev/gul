name: Reset test seller password (WRITES)

# Sets a known password on the one seeded QA account (+70000000099 / test_seller_qa), so staff can
# actually log into the seller panel to test it. Nothing recovers the old password -- it is
# hashed, and guessing at it is exactly the thing LoginAttemptsService now exists to slow down.
# Resetting it under an audited workflow is the honest way to get back in, not around that.
#
# Refuses to touch any account other than this one. The phone is hardcoded rather than taken as
# an input on purpose: a free-text phone input on a "WRITES" password-reset workflow is a way to
# reset a real customer's password by typo, and this exists for exactly one seeded test account.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RESET to proceed
        required: true

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation
        run: |
          [ "${{ inputs.confirm }}" = "RESET" ] || { echo "not confirmed" >&2; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate a password and hash it the same way the app does
        id: hash
        # Run directly on the runner rather than inside a throwaway container: argon2 needs its
        # prebuilt native binding fetched at install time, and the nested docker-run's own network
        # path is one more thing that can silently swallow that failure -- which is exactly what
        # happened the first time this ran (npm install failed quietly under --silent, and with no
        # `set -e` inside that inner shell, node then ran anyway and died with "Cannot find module").
        run: |
          set -e
          PASSWORD=$(openssl rand -base64 18 | tr -d '=+/' | cut -c1-16)
          mkdir -p /tmp/hashwork && cd /tmp/hashwork
          npm install argon2@0.41
          HASH=$(node -e "require('argon2').hash(process.argv[1]).then(h => console.log(h))" "$PASSWORD")
          [ -n "$HASH" ] || { echo "argon2 produced no output" >&2; exit 1; }
          # Deliberately NOT masked: the password is the deliverable of this workflow, printed in
          # the final step below for staff to read. `::add-mask::` blanks every later occurrence
          # of the exact string for the rest of the run, which the first version of this workflow
          # did to the password itself -- the log then printed "password: ***" and told nobody
          # anything. The hash is masked; it is derived from the account's credential even though
          # it cannot be reversed into the password.
          echo "::add-mask::$HASH"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          cd / && rm -rf /tmp/hashwork

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Apply, confirming exactly one row changed
        env:
          HASH: ${{ steps.hash.outputs.hash }}
        run: |
          set -e
          cat > /tmp/reset.sql <<SQL
          UPDATE "User" SET "passwordHash" = '$HASH'
          WHERE phone = '+70000000099' AND role = 'SELLER';
          SQL
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'cd /opt/gul && docker compose exec -T postgres sh -c "psql -X -v ON_ERROR_STOP=1 -U \"\$POSTGRES_USER\" \"\$POSTGRES_DB\""' \
            < /tmp/reset.sql
          rm -f /tmp/reset.sql

      - name: Credentials
        env:
          PASSWORD: ${{ steps.hash.outputs.password }}
        run: |
          echo "phone:    +70000000099"
          echo "password: $PASSWORD"
          echo
          echo "Seller panel: https://gulyaly.pro/seller (log in like a customer, then it routes here)"
