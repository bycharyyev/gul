name: One-off - FreeKassa API order link per method

# Creates two unpaid 10 RUB test orders through POST /orders/create (SBP 42, Card 36) from the
# primary, and prints the payment links FreeKassa returns, to compare with the hosted form, which
# sends desk 78024's payers to FKwallet. The order ids are unknown to our API. Delete after use.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      PRIMARY: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      SHOP: ${{ secrets.FREEKASSA_SHOP_ID }}
      KEY: ${{ secrets.FREEKASSA_API_KEY }}
      HOSTIP: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Set up SSH (pinned host keys)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Create test orders
        run: |
          n=0
          for i in 42 36; do
            n=$((n + 1))
            nonce=$(( $(date +%s%3N) + n ))
            pid="diag-api-$i-$(date +%s)"
            body=$(jq -cn --argjson shopId "$SHOP" --argjson nonce "$nonce" --arg paymentId "$pid" --argjson i "$i" \
              --arg email "test@gulyaly.pro" --arg ip "$HOSTIP" --arg amount "10.00" --arg currency "RUB" \
              '{shopId:$shopId, nonce:$nonce, paymentId:$paymentId, i:$i, email:$email, ip:$ip, amount:$amount, currency:$currency}')
            sig=$(echo "$body" | jq -r 'to_entries | sort_by(.key) | map(.value | tostring) | join("|")' | tr -d '\n' | openssl dgst -sha256 -hmac "$KEY" -r | cut -d' ' -f1)
            body=$(echo "$body" | jq -c --arg s "$sig" '. + {signature:$s}')
            answer=$(ssh -i ~/.ssh/deploy_key "$PRIMARY" "curl -s -m 25 -X POST -H 'Content-Type: application/json' -d '$body' https://api.fk.life/v1/orders/create" < /dev/null)
            echo "=== i=$i: $(echo "$answer" | jq -c '{type, message: (.message // null), orderId, location}' 2>/dev/null || echo "$answer" | head -c 300)" | sed "s/$HOSTIP/HOST/g"
          done
