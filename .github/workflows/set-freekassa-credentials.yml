name: Set FreeKassa credentials on both hosts

# Writes FREEKASSA_SHOP_ID, FREEKASSA_SECRET_WORD_1, FREEKASSA_SECRET_WORD_2 and FREEKASSA_API_KEY
# from the repository secrets of the same names into /opt/gul/.env and /opt/gul-secondary/.env,
# then recreates the three API processes on each host. The FreeKassa adapter registers itself only
# when all four are present (ADR-0005), so this is what makes the provider exist.
#
# The values never reach a log: they go into a 0600 file on the runner, are copied to each host
# and merged there, and only key names are printed. Re-run after rotating any of them in the
# FreeKassa account.

on:
  workflow_dispatch:

jobs:
  set:
    runs-on: ubuntu-latest
    env:
      PRIMARY: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      SECONDARY: ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}
      FREEKASSA_SHOP_ID: ${{ secrets.FREEKASSA_SHOP_ID }}
      FREEKASSA_SECRET_WORD_1: ${{ secrets.FREEKASSA_SECRET_WORD_1 }}
      FREEKASSA_SECRET_WORD_2: ${{ secrets.FREEKASSA_SECRET_WORD_2 }}
      FREEKASSA_API_KEY: ${{ secrets.FREEKASSA_API_KEY }}
    steps:
      - name: Set up SSH (pinned host keys)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Build the env fragment (refuses missing or unsafe values)
        run: |
          umask 077
          : > /tmp/fk.env
          for key in FREEKASSA_SHOP_ID FREEKASSA_SECRET_WORD_1 FREEKASSA_SECRET_WORD_2 FREEKASSA_API_KEY; do
            value="${!key}"
            [ -n "$value" ] || { echo "repository secret $key is not set" >&2; exit 1; }
            # Written single-quoted for the shell-like .env; a quote or newline could not be.
            case "$value" in *"'"*|*$'\n'*) echo "$key contains a quote or newline; regenerate it" >&2; exit 1;; esac
            printf "%s='%s'\n" "$key" "$value" >> /tmp/fk.env
          done
          [[ "$FREEKASSA_SHOP_ID" =~ ^[0-9]+$ ]] || { echo "FREEKASSA_SHOP_ID must be the numeric shop id" >&2; exit 1; }
          echo "keys: $(cut -d= -f1 /tmp/fk.env | tr '\n' ' ')"

      - name: Write to both hosts and recreate the API processes
        run: |
          apply() {
            scp -i ~/.ssh/deploy_key /tmp/fk.env "$1:/tmp/fk.env"
            ssh -i ~/.ssh/deploy_key "$1" '
              set -e
              cd '"$2"'
              umask 077
              cp -p .env ".env.bak-freekassa-$(date +%Y%m%d%H%M%S)"
              { grep -vE "^FREEKASSA_(SHOP_ID|SECRET_WORD_1|SECRET_WORD_2|API_KEY)=" .env; cat /tmp/fk.env; } > /tmp/env.new
              cat /tmp/env.new > .env
              rm -f /tmp/env.new /tmp/fk.env
              for attempt in 1 2 3; do
                docker compose up -d --force-recreate --no-deps api api-2 api-worker && break
                sleep $((attempt * 10))
              done
              for port in 4001 4000 4002; do
                ok=0
                for i in $(seq 1 30); do
                  curl -fsS "http://127.0.0.1:$port/api/health/ready" > /dev/null && { ok=1; break; }
                  sleep 2
                done
                [ "$ok" = 1 ] || { echo "port $port did not come back healthy" >&2; exit 1; }
              done
              echo "healthy: '"$2"'"' < /dev/null
          }
          apply "$PRIMARY" /opt/gul
          apply "$SECONDARY" /opt/gul-secondary
          rm -f /tmp/fk.env

      - name: The provider now answers (an unsigned probe must be refused, not "unknown provider")
        run: |
          for ip in "${{ secrets.DEPLOY_HOST }}" "${{ secrets.SECONDARY_HOST }}"; do
            body=$(curl -s --resolve "api.gulyaly.com:443:$ip" -X POST \
              -H "Content-Type: application/x-www-form-urlencoded" -d "probe=1" \
              https://api.gulyaly.com/api/payments/webhooks/freekassa)
            echo "$body" | grep -q "Unknown payment provider" && { echo "FreeKassa is not registered on a node" >&2; exit 1; }
            echo "node answers: $(echo "$body" | head -c 120)"
          done
