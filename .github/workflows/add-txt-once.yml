name: One-off DNS record helper for gulyaly.com

# Small generic helper for one-off verification records (Google Search Console TXT, Bing
# Webmaster CNAME, etc.) that don't warrant their own dedicated workflow. Deleted after use.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to do'
        required: true
        type: choice
        options:
          - list-apex-records
          - add-apex-txt
          - add-subdomain-cname
      value:
        description: 'add-apex-txt: the TXT value. add-subdomain-cname: the CNAME target (e.g. verify.bing.com)'
        required: false
        type: string
      subdomain:
        description: 'add-subdomain-cname only: the label, e.g. e3754ad5dfbe2e5bb26bf59ab5fe631b'
        required: false
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: List apex records
        if: inputs.mode == 'list-apex-records'
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.TIMEWEB_API_TOKEN }}" \
            "https://api.timeweb.cloud/api/v1/domains/gulyaly.com/dns-records" | python -m json.tool

      - name: Add TXT record at gulyaly.com apex
        if: inputs.mode == 'add-apex-txt'
        run: |
          BODY=$(python -c "import json,sys; print(json.dumps({'type':'TXT','value':sys.argv[1],'ttl':600}))" "${{ inputs.value }}")
          curl -s -w '\nHTTP %{http_code}\n' -X POST "https://api.timeweb.cloud/api/v2/domains/gulyaly.com/dns-records" \
            -H "Authorization: Bearer ${{ secrets.TIMEWEB_API_TOKEN }}" -H "Content-Type: application/json" -d "$BODY"

      - name: Add CNAME record at a subdomain
        if: inputs.mode == 'add-subdomain-cname'
        run: |
          set -e
          SUB="${{ inputs.subdomain }}"
          echo "--- registering subdomain $SUB ---"
          curl -s -X POST "https://api.timeweb.cloud/api/v1/domains/gulyaly.com/subdomains/$SUB" \
            -H "Authorization: Bearer ${{ secrets.TIMEWEB_API_TOKEN }}"
          echo
          echo "--- adding CNAME ---"
          BODY=$(python -c "import json,sys; print(json.dumps({'type':'CNAME','value':sys.argv[1],'ttl':600}))" "${{ inputs.value }}")
          curl -s -w '\nHTTP %{http_code}\n' -X POST "https://api.timeweb.cloud/api/v2/domains/$SUB.gulyaly.com/dns-records" \
            -H "Authorization: Bearer ${{ secrets.TIMEWEB_API_TOKEN }}" -H "Content-Type: application/json" -d "$BODY"
