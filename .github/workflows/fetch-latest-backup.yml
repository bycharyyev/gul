name: Fetch latest backup

# Downloads the newest encrypted database dump from the backup bucket and attaches it to the run
# as an artifact, for infra/backups/restore-drill.sh on the owner's PC (the only place its private
# key exists). The object is AES-256-GCM encrypted to that key, so the artifact is unreadable to
# anyone else who can see this run. Kept for one day.

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download the newest encrypted dump
        env:
          S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          set -euo pipefail
          s3() {
            curl --fail --silent --show-error --location \
              --user "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" \
              --aws-sigv4 "aws:amz:us-east-1:s3" "$@"
          }
          BASE="${S3_ENDPOINT%/}/$S3_BUCKET"
          LATEST=$(s3 "$BASE?list-type=2&prefix=db-backups/" \
            | grep -o '<Key>[^<]*\.cms</Key>' | sed 's/<[^>]*>//g' | sort | tail -1)
          if [ -z "$LATEST" ]; then
            echo "no encrypted backups in the bucket yet" >&2
            exit 1
          fi
          mkdir -p out
          s3 --output "out/$(basename "$LATEST")" "$BASE/$LATEST"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: latest-backup
          path: out/
          retention-days: 1
          if-no-files-found: error
