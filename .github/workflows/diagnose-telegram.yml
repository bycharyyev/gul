name: Diagnose bot polling health

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check bot polling + token sanity
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            cd /opt/gul
            echo "--- how many TELEGRAM_BOT_TOKEN lines in .env ---"
            grep -c "^TELEGRAM_BOT_TOKEN=" .env
            echo "--- token length as seen from the .env file (no value printed) ---"
            grep "^TELEGRAM_BOT_TOKEN=" .env | awk -F= "{print length(\$0)-length(\$1)-1}"
            echo "--- token length as seen INSIDE the running container (no value printed) ---"
            docker compose exec -T api sh -c "echo -n \"\$TELEGRAM_BOT_TOKEN\" | wc -c" < /dev/null
            echo "--- getMe using the container'"'"'s own env var (this is the one that matters) ---"
            docker compose exec -T api node -e "fetch(\`https://api.telegram.org/bot\${process.env.TELEGRAM_BOT_TOKEN}/getMe\`).then(r=>r.text()).then(console.log)" < /dev/null
          '
