name: Diagnose platform Telegram connect

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check primary env and logs
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            cd /opt/gul
            echo "--- PRIMARY: docker compose ps ---"
            docker compose ps
            echo "--- PRIMARY: api container started-at ---"
            docker inspect -f "{{.State.StartedAt}} {{.Name}}" $(docker compose ps -q api)
            echo "--- PRIMARY: api container config-hash label ---"
            docker inspect -f "{{ index .Config.Labels \"com.docker.compose.config-hash\" }}" $(docker compose ps -q api)
            echo "--- PRIMARY: docker compose config resolved env for api (TELEGRAM only) ---"
            docker compose config 2>/dev/null | awk "/^  api:/,/^  [a-z]/" | grep -i telegram
            echo "--- PRIMARY: IMAGE_TAG in .env ---"
            grep "^IMAGE_TAG=" .env
          '

      - name: Check secondary env
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }} '
            cd /opt/gul-secondary
            echo "--- SECONDARY: docker compose ps ---"
            docker compose -f docker-compose.secondary.yml ps
            echo "--- SECONDARY: api container started-at ---"
            docker inspect -f "{{.State.StartedAt}} {{.Name}}" $(docker compose -f docker-compose.secondary.yml ps -q api)
            echo "--- SECONDARY: IMAGE_TAG in .env ---"
            grep "^IMAGE_TAG=" .env
          '
