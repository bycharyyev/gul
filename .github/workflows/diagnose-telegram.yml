name: Check admin bot linking + activity

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check state and recent activity
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            cd /opt/gul
            echo "--- PlatformSettings (booleans only) ---"
            docker compose exec -T api node -e "
              const { PrismaClient } = require(\"@prisma/client\");
              const p = new PrismaClient();
              p.platformSettings.findUnique({ where: { id: \"singleton\" } }).then(row => {
                console.log(JSON.stringify({
                  hasChatId: !!(row && row.adminTelegramChatId),
                  hasPendingCode: !!(row && row.adminTelegramLinkCode),
                  updatedAt: row && row.updatedAt,
                }));
                process.exit(0);
              }).catch(e => { console.error(String(e)); process.exit(1); });
            " < /dev/null
            echo "--- admin bot + platform-settings + order notify activity (last 30min) ---"
            docker compose logs --since 30min api 2>&1 | grep -iE "AdminTelegramBotService|platform-settings|Failed to notify admin" | tail -60
          '
