name: Check notification delivery after the test order

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check for delivery errors or polling conflicts
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            cd /opt/gul
            echo "--- errors/conflicts in the last 10 minutes ---"
            docker compose logs --since 10min api 2>&1 | grep -iE "Failed to notify|409 Conflict|stopped unexpectedly" || echo "none found"
            echo "--- both bots still up, no restart ---"
            docker compose ps api
          '

      - name: Confirm the message actually landed in the admin chat
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_ADMIN_BOT_TOKEN }}/getWebhookInfo"
