name: Diagnose platform Telegram connect

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check primary env and logs
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            cd /opt/gul
            echo "--- PRIMARY: how many TELEGRAM_BOT_USERNAME lines in .env (count only, no content) ---"
            grep -c "^TELEGRAM_BOT_USERNAME=" .env
            echo "--- PRIMARY: container env var NAMES only (no values), telegram-related ---"
            docker compose exec -T api sh -c "env | cut -d= -f1 | grep -i telegram" < /dev/null || echo "ZERO telegram-related var NAMES in container"
            echo "--- PRIMARY: docker compose version ---"
            docker compose version
          '

      - name: Check secondary env
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }} '
            echo "--- SECONDARY: /opt/gul-secondary listing ---"
            ls -la /opt/gul-secondary
          '
