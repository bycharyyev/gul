name: Quick health check

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check disk and postgres
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            cd /opt/gul
            echo "--- disk ---"
            df -h /
            echo "--- containers ---"
            docker compose ps
            echo "--- postgres logs last 15min ---"
            docker compose logs --since 15m postgres 2>&1 | tail -40
            echo "--- api logs mentioning database/unreachable last 15min ---"
            docker compose logs --since 15m api 2>&1 | grep -iE "database|unreachable|ECONNREFUSED|timeout" | tail -40
          '
