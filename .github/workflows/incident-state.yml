name: Incident state (read-only)

# During an outage: what the witness and the secondary see -- etcd health, the Patroni leader,
# what each Sentinel names as master and whether quorum holds. Read-only; tolerates dead hosts.

on:
  workflow_dispatch: {}

jobs:
  state:
    runs-on: ubuntu-latest
    env:
      A: ${{ secrets.DEPLOY_HOST }}
      B: ${{ secrets.SECONDARY_HOST }}
      W: ${{ secrets.WITNESS_HOST }}
      PB: ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}
      PW: ${{ secrets.WITNESS_USER }}@${{ secrets.WITNESS_HOST }}
    steps:
      - name: Look
        shell: bash {0}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/k && chmod 600 ~/.ssh/k
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          s() { ssh -i ~/.ssh/k -o ConnectTimeout=10 -o BatchMode=yes "$@" < /dev/null; }
          for t in "$PW" "$PB"; do
            echo "======== $( [ "$t" = "$PW" ] && echo witness || echo secondary ) ========"
            s "$t" "uptime; docker ps --format '{{.Names}} {{.Status}}' | sort"
            s "$t" "docker exec gul-etcd etcdctl --endpoints=http://$A:2379,http://$B:2379,http://$W:2379 endpoint health 2>&1 | sed 's/http:[^ ]*/node/'"
            m=$(s "$t" "docker exec gul-sentinel redis-cli -p 26379 sentinel get-master-addr-by-name gul | head -1")
            echo "sentinel says master: $( [ "$m" = "$A" ] && echo primary || { [ "$m" = "$B" ] && echo secondary || echo "?$m"; } )"
            s "$t" "docker exec gul-sentinel redis-cli -p 26379 sentinel ckquorum gul; docker exec gul-sentinel redis-cli -p 26379 sentinel sentinels gul | grep -A1 -E '^flags$' | grep -v -- --"
          done
          echo "======== patroni (from secondary) ========"
          s "$PB" "docker exec gul-pg patronictl -c /tmp/patroni.yml list"
