name: tmp pro cleanup
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan -H ${{ secrets.SECONDARY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      - name: Relay sender map -> gulyaly.com addresses
        run: |
          cat > /tmp/map.sh <<'SCRIPT'
          set -e
          echo "--- before"; cat /etc/postfix/sender_login_maps
          cp /etc/postfix/sender_login_maps /etc/postfix/sender_login_maps.bak-pro
          cat > /etc/postfix/sender_login_maps <<'MAP'
          noreply@gulyaly.com noreply@mail.gulyaly.pro
          news@gulyaly.com newsletter@mail.gulyaly.pro
          alerts@gulyaly.com alerts@mail.gulyaly.pro
          MAP
          postmap hash:/etc/postfix/sender_login_maps
          postfix check
          systemctl reload postfix
          sleep 1
          echo "--- after"; cat /etc/postfix/sender_login_maps; systemctl is-active postfix
          SCRIPT
          scp -i ~/.ssh/k /tmp/map.sh ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}:/tmp/map.sh
          ssh -i ~/.ssh/k ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }} 'docker run --rm --pid=host --privileged -v /:/host -v /tmp/map.sh:/host/tmp/map.sh alpine chroot /host /bin/bash /tmp/map.sh; s=$?; rm -f /tmp/map.sh; exit $s' < /dev/null
      - name: Alert scripts + relay host on both nodes
        run: |
          cat > /tmp/alerts.sh <<'SCRIPT'
          set -e
          cp /tmp/gul-disk-alert.sh /usr/local/bin/gul-disk-alert.sh; chmod 755 /usr/local/bin/gul-disk-alert.sh
          if [ -f /usr/local/bin/gul-primary-db-alert.sh ]; then cp /tmp/gul-primary-db-alert.sh /usr/local/bin/gul-primary-db-alert.sh; chmod 755 /usr/local/bin/gul-primary-db-alert.sh; fi
          for f in /etc/gul-*alert*.env; do [ -f "$f" ] || continue; sed -i 's#^MAIL_RELAY_HOST=.*#MAIL_RELAY_HOST=mail.gulyaly.com#' "$f"; echo "updated $f"; done
          SCRIPT
          for h in "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}"; do
            scp -i ~/.ssh/k infra/alerts/gul-disk-alert.sh infra/alerts/gul-primary-db-alert.sh /tmp/alerts.sh "$h:/tmp/"
            ssh -i ~/.ssh/k "$h" 'docker run --rm --pid=host --privileged -v /:/host -v /tmp/alerts.sh:/host/tmp/alerts.sh -v /tmp/gul-disk-alert.sh:/host/tmp/gul-disk-alert.sh -v /tmp/gul-primary-db-alert.sh:/host/tmp/gul-primary-db-alert.sh alpine chroot /host /bin/bash /tmp/alerts.sh; s=$?; rm -f /tmp/alerts.sh /tmp/gul-disk-alert.sh /tmp/gul-primary-db-alert.sh; exit $s' < /dev/null
          done
      - name: Real alert test send from primary
        run: |
          ssh -i ~/.ssh/k ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'docker run --rm --pid=host --privileged --network=host -v /:/host alpine chroot /host /bin/bash -c "/usr/local/bin/gul-disk-alert.sh --test; echo exit=\$?"' < /dev/null
