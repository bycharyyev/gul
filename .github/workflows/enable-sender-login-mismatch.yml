name: Step 3c -- enable smtpd_sender_login_maps + reject_sender_login_mismatch

# Locks each SASL account to only the From address it's allowed to claim, so mail claiming a
# newsletter.gulyaly.pro From is only accepted if authenticated as the "newsletter" account (and
# vice versa for the transactional "noreply" account). Deliberately the LAST step of the mail-split
# work, gated on step 3b being proven end-to-end (confirmed 2026-08-28: real Gmail delivery,
# 250 sent, DKIM selector news2026, correct SPF -- see rotate-newsletter-password.yml's last run).
#
# smtpd_sender_restrictions / smtpd_sender_login_maps were both empty before this (confirmed via
# postconf), so this is purely additive -- no existing restriction is being replaced.
#
# Requires a `postfix reload` to take effect -- reload (not restart) keeps listening sockets open,
# near-zero downtime, but this still touches live mail config, so this workflow verifies BOTH a
# legitimate send (still works) and a mismatched send (now correctly rejected) before declaring
# success, rather than just checking "config applied."

on:
  workflow_dispatch:
    inputs:
      newsletter_password:
        description: 'New password to set for the newsletter SASL account -- rotated again here since the agent never retains the previous one (masked in logs, never echoed)'
        required: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SECONDARY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Mask the password
        run: echo "::add-mask::${{ inputs.newsletter_password }}"

      - name: Rotate the SASL account password (same account, fresh value -- keeps prod .env and sasldb consistent)
        env:
          NL_PASS: ${{ inputs.newsletter_password }}
        run: |
          cat > /tmp/rotate-sasl.sh <<'SCRIPT'
          set -e
          echo '__PASS_PLACEHOLDER__' | saslpasswd2 -p -c -u mail.gulyaly.pro newsletter
          SCRIPT
          sed -i "s#__PASS_PLACEHOLDER__#$NL_PASS#" /tmp/rotate-sasl.sh
          scp -i ~/.ssh/id_ed25519 /tmp/rotate-sasl.sh ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}:/tmp/rotate-sasl.sh
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }} '
            docker run --rm --pid=host --privileged -v /:/host -v /tmp/rotate-sasl.sh:/host/tmp/rotate-sasl.sh alpine chroot /host /bin/bash /tmp/rotate-sasl.sh
            status=$?
            rm -f /tmp/rotate-sasl.sh
            exit $status
          ' < /dev/null
          rm -f /tmp/rotate-sasl.sh

      - name: Write the same password into primary's .env, restart api
        env:
          NL_PASS: ${{ inputs.newsletter_password }}
        run: |
          cat > /tmp/env-update.sh <<'SCRIPT'
          set -e
          cd /opt/gul
          set_kv() {
            key="$1"; val="$2"
            if grep -q "^${key}=" .env; then
              sed -i "s#^${key}=.*#${key}=\"${val}\"#" .env
            else
              echo "${key}=\"${val}\"" >> .env
            fi
          }
          set_kv MAIL_PASS_MARKETING '__PASS_PLACEHOLDER__'
          docker compose up -d --force-recreate --no-deps api
          SCRIPT
          sed -i "s#__PASS_PLACEHOLDER__#$NL_PASS#" /tmp/env-update.sh
          scp -i ~/.ssh/id_ed25519 /tmp/env-update.sh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/env-update.sh
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash /tmp/env-update.sh && rm -f /tmp/env-update.sh' < /dev/null
          rm -f /tmp/env-update.sh

      - name: Health-check after restart
        run: |
          for i in $(seq 1 15); do
            curl -fsS https://api.gulyaly.pro/api/health/ready > /dev/null && echo healthy && exit 0
            sleep 2
          done
          exit 1

      - name: Write sender_login_maps, wire it into main.cf, reload postfix
        run: |
          cat > /tmp/apply-3c.sh <<'SCRIPT'
          set -e
          cat > /etc/postfix/sender_login_maps <<'MAP'
          noreply@gulyaly.pro noreply@mail.gulyaly.pro
          news@newsletter.gulyaly.pro newsletter@mail.gulyaly.pro
          MAP
          postmap hash:/etc/postfix/sender_login_maps
          postconf -e 'smtpd_sender_login_maps = hash:/etc/postfix/sender_login_maps'
          postconf -e 'smtpd_sender_restrictions = reject_sender_login_mismatch'
          echo "--- postfix check (config syntax) ---"
          postfix check
          echo "--- reloading ---"
          systemctl reload postfix
          sleep 1
          systemctl is-active postfix
          echo "--- applied settings ---"
          postconf smtpd_sender_restrictions smtpd_sender_login_maps
          SCRIPT
          scp -i ~/.ssh/id_ed25519 /tmp/apply-3c.sh ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}:/tmp/apply-3c.sh
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }} '
            docker run --rm --pid=host --privileged -v /:/host -v /tmp/apply-3c.sh:/host/tmp/apply-3c.sh alpine chroot /host /bin/bash /tmp/apply-3c.sh
            status=$?
            rm -f /tmp/apply-3c.sh
            exit $status
          ' < /dev/null
          rm -f /tmp/apply-3c.sh

      - name: Verify -- legitimate send (newsletter account, correct From) must still succeed
        env:
          NL_PASS: ${{ inputs.newsletter_password }}
        run: |
          cat > /tmp/verify-good.sh <<'SCRIPT'
          set -e
          BODY_FILE=$(mktemp)
          { echo "From: Gulyaly News <news@newsletter.gulyaly.pro>"; echo "To: news@newsletter.gulyaly.pro"; echo "Subject: 3c verify -- matching sender"; echo; echo "should be accepted"; } > "$BODY_FILE"
          curl -s -m 20 -k --url "smtp://mail.gulyaly.pro:587" --resolve "mail.gulyaly.pro:587:127.0.0.1" --ssl-reqd \
            --mail-from "news@newsletter.gulyaly.pro" --mail-rcpt "news@newsletter.gulyaly.pro" \
            --user "newsletter:__PASS_PLACEHOLDER__" --upload-file "$BODY_FILE"
          echo "curl exit: $?"
          rm -f "$BODY_FILE"
          SCRIPT
          sed -i "s#__PASS_PLACEHOLDER__#$NL_PASS#" /tmp/verify-good.sh
          scp -i ~/.ssh/id_ed25519 /tmp/verify-good.sh ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}:/tmp/verify-good.sh
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }} '
            docker run --rm --pid=host --network=host --privileged -v /:/host -v /tmp/verify-good.sh:/host/tmp/verify-good.sh alpine chroot /host /bin/bash /tmp/verify-good.sh
            rm -f /tmp/verify-good.sh
          ' < /dev/null
          rm -f /tmp/verify-good.sh

      - name: Verify -- mismatched send (newsletter account claiming noreply From) must now be REJECTED
        env:
          NL_PASS: ${{ inputs.newsletter_password }}
        run: |
          cat > /tmp/verify-bad.sh <<'SCRIPT'
          set +e
          BODY_FILE=$(mktemp)
          { echo "From: Gulyaly <noreply@gulyaly.pro>"; echo "To: news@newsletter.gulyaly.pro"; echo "Subject: 3c verify -- mismatched sender, should be rejected"; echo; echo "should be rejected"; } > "$BODY_FILE"
          OUT=$(curl -s -m 20 -k --url "smtp://mail.gulyaly.pro:587" --resolve "mail.gulyaly.pro:587:127.0.0.1" --ssl-reqd \
            --mail-from "noreply@gulyaly.pro" --mail-rcpt "news@newsletter.gulyaly.pro" \
            --user "newsletter:__PASS_PLACEHOLDER__" --upload-file "$BODY_FILE" 2>&1)
          CODE=$?
          echo "$OUT"
          rm -f "$BODY_FILE"
          if [ $CODE -eq 0 ]; then
            echo "!!! UNEXPECTED: curl succeeded -- the mismatch was NOT rejected, restriction is not working"
            exit 1
          else
            echo "OK: curl failed as expected (exit $CODE) -- relay correctly rejected the sender/login mismatch"
            exit 0
          fi
          SCRIPT
          sed -i "s#__PASS_PLACEHOLDER__#$NL_PASS#" /tmp/verify-bad.sh
          scp -i ~/.ssh/id_ed25519 /tmp/verify-bad.sh ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}:/tmp/verify-bad.sh
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }} '
            docker run --rm --pid=host --network=host --privileged -v /:/host -v /tmp/verify-bad.sh:/host/tmp/verify-bad.sh alpine chroot /host /bin/bash /tmp/verify-bad.sh
            status=$?
            rm -f /tmp/verify-bad.sh
            exit $status
          ' < /dev/null
          rm -f /tmp/verify-bad.sh
