name: Sync mail config to the secondary

# Makes the secondary's api send mail exactly like the primary's: same MAIL_* settings, same relay.
#
# Why it exists: both api nodes take jobs from the one shared queue, so either node can send any
# email. smtp-integration-test.yml (2026-10-01) found the two had drifted:
#   * the secondary still sent transactional mail through REG.RU, the primary through our relay;
#   * the secondary's marketing transport timed out. The relay is Postfix on the secondary host,
#     and ufw allows port 587 only from the primary's IP. The secondary's own containers reach it
#     from a docker bridge address, which ufw dropped.
#
# What it does, idempotently:
#   1. ufw on the secondary: allow 587 from the api container's docker network only. Port 587
#      stays closed to the internet (check-exposed-ports.yml checks that from outside).
#   2. Copy every MAIL_* line of /opt/gul/.env over the MAIL_* lines of /opt/gul-secondary/.env,
#      backing the old file up next to it first. Values never touch a log: they go host to runner
#      file to host, and only key names and short fingerprints are printed.
#   3. Recreate the secondary's api, wait for health, then run the SMTP check on both nodes.
#
# Re-run it after any change to the primary's MAIL_* (password rotation, relay move).

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PRIMARY: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      SECONDARY: ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH (pinned host keys)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Compare MAIL_* on both hosts (key names and fingerprints only)
        run: |
          fp='grep -E "^MAIL_[A-Z0-9_]*=" .env | sort | while IFS= read -r l; do printf "%s %s\n" "${l%%=*}" "$(printf %s "${l#*=}" | sha256sum | cut -c1-8)"; done'
          ssh -i ~/.ssh/deploy_key "$PRIMARY" "cd /opt/gul && $fp" < /dev/null > /tmp/fp-primary
          ssh -i ~/.ssh/deploy_key "$SECONDARY" "cd /opt/gul-secondary && $fp" < /dev/null > /tmp/fp-secondary
          echo "primary | secondary"
          diff -y -W 60 /tmp/fp-primary /tmp/fp-secondary || true

      - name: Allow 587 from the secondary's own api network
        run: |
          # The api container's network subnet, read from docker rather than assumed.
          subnet=$(ssh -i ~/.ssh/deploy_key "$SECONDARY" '
            cd /opt/gul-secondary
            c=$(docker compose ps -q api)
            for n in $(docker inspect -f "{{range \$k, \$v := .NetworkSettings.Networks}}{{\$k}} {{end}}" "$c"); do
              docker network inspect -f "{{range .IPAM.Config}}{{.Subnet}}{{end}}" "$n"
            done' < /dev/null | head -1)
          echo "api network subnet: $subnet"
          printf '%s' "$subnet" | grep -Eq '^(10|172|192)\.[0-9.]+/[0-9]+$' || { echo "unexpected subnet" >&2; exit 1; }

          cat > /tmp/mail-ufw-local.sh <<'SCRIPT'
          set -e
          ufw allow from __SUBNET__ to any port 587 proto tcp comment 'mail submission from this host api containers'
          ufw status | grep 587
          SCRIPT
          sed -i "s#__SUBNET__#$subnet#" /tmp/mail-ufw-local.sh
          scp -i ~/.ssh/deploy_key /tmp/mail-ufw-local.sh "$SECONDARY:/tmp/mail-ufw-local.sh"
          # --network=host: without it ufw would change the throwaway container's own firewall.
          ssh -i ~/.ssh/deploy_key "$SECONDARY" '
            docker run --rm --pid=host --network=host --privileged -v /:/host -v /tmp/mail-ufw-local.sh:/host/tmp/mail-ufw-local.sh alpine chroot /host /bin/sh /tmp/mail-ufw-local.sh
            rc=$?; rm -f /tmp/mail-ufw-local.sh; exit $rc' < /dev/null

      - name: Copy MAIL_* from the primary to the secondary
        run: |
          umask 077
          ssh -i ~/.ssh/deploy_key "$PRIMARY" 'grep -E "^MAIL_[A-Z0-9_]*=" /opt/gul/.env' < /dev/null > /tmp/mail.env
          grep -q '^MAIL_HOST=' /tmp/mail.env || { echo "primary has no MAIL_HOST -- refusing" >&2; exit 1; }
          scp -i ~/.ssh/deploy_key /tmp/mail.env "$SECONDARY:/tmp/mail.env"
          rm -f /tmp/mail.env
          ssh -i ~/.ssh/deploy_key "$SECONDARY" '
            set -e
            cd /opt/gul-secondary
            umask 077
            cp -p .env ".env.bak-mail-$(date +%Y%m%d%H%M%S)"
            { grep -vE "^MAIL_[A-Z0-9_]*=" .env; cat /tmp/mail.env; } > /tmp/env.new
            cat /tmp/env.new > .env   # keeps .env'"'"'s own owner and mode
            rm -f /tmp/env.new /tmp/mail.env
            echo "MAIL_* keys now: $(grep -cE "^MAIL_[A-Z0-9_]*=" .env)"' < /dev/null

      - name: Recreate the secondary's api and wait for health
        run: |
          ssh -i ~/.ssh/deploy_key "$SECONDARY" '
            cd /opt/gul-secondary
            for attempt in 1 2 3; do
              docker compose up -d --force-recreate --no-deps api && break
              sleep $((attempt * 10))
            done
            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:4000/api/health/ready > /dev/null && echo healthy && exit 0
              sleep 2
            done
            echo "api did NOT come back healthy" >&2; exit 1' < /dev/null

      - name: SMTP check on both nodes
        run: |
          for t in "$PRIMARY /opt/gul" "$SECONDARY /opt/gul-secondary"; do
            set -- $t
            echo "== ${2##*/}"
            scp -i ~/.ssh/deploy_key infra/checks/smtp-check.js "$1:/tmp/smtp-check.js"
            ssh -i ~/.ssh/deploy_key "$1" "cd $2 && docker compose exec -T api node - < /tmp/smtp-check.js; rc=\$?; rm -f /tmp/smtp-check.js; exit \$rc" || fail=1
          done
          exit ${fail:-0}

      - name: Fingerprints after (should now match)
        if: always()
        run: |
          fp='grep -E "^MAIL_[A-Z0-9_]*=" .env | sort | while IFS= read -r l; do printf "%s %s\n" "${l%%=*}" "$(printf %s "${l#*=}" | sha256sum | cut -c1-8)"; done'
          a=$(ssh -i ~/.ssh/deploy_key "$PRIMARY" "cd /opt/gul && $fp" < /dev/null)
          b=$(ssh -i ~/.ssh/deploy_key "$SECONDARY" "cd /opt/gul-secondary && $fp" < /dev/null)
          [ "$a" = "$b" ] && echo "MAIL_* identical on both hosts" || { echo "MAIL_* still differ" >&2; exit 1; }
          rm -f /tmp/fp-primary /tmp/fp-secondary
