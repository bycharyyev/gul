name: Sync mail config to the secondary

# Makes the secondary's api send mail exactly like the primary's: same MAIL_* settings.
# App mail goes through REG.RU (switch-mail-to-regru.yml). This copies whatever the primary has.
#
# Both api nodes take jobs from the one shared queue, so either node can send any email and the
# two must carry identical MAIL_*. Check first that the primary is the correct side (docs/EMAIL.md:
# REG.RU) -- on 2026-10-01 this copied a primary that had drifted onto the relay, and mail went
# to spam.
#
# What it does: copies every MAIL_* line of /opt/gul/.env over the MAIL_* lines of
# /opt/gul-secondary/.env (backing the old file up first; values never touch a log, only key names
# and short fingerprints are printed), recreates the secondary's api, and runs the SMTP check on
# both nodes.
#
# Re-run it after any change to the primary's MAIL_* (e.g. a mailbox password change).

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PRIMARY: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      SECONDARY: ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH (pinned host keys)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Compare MAIL_* on both hosts (key names and fingerprints only)
        run: |
          fp='grep -E "^MAIL_[A-Z0-9_]*=" .env | sort | while IFS= read -r l; do printf "%s %s\n" "${l%%=*}" "$(printf %s "${l#*=}" | sha256sum | cut -c1-8)"; done'
          ssh -i ~/.ssh/deploy_key "$PRIMARY" "cd /opt/gul && $fp" < /dev/null > /tmp/fp-primary
          ssh -i ~/.ssh/deploy_key "$SECONDARY" "cd /opt/gul-secondary && $fp" < /dev/null > /tmp/fp-secondary
          echo "primary | secondary"
          diff -y -W 60 /tmp/fp-primary /tmp/fp-secondary || true

      - name: Copy MAIL_* from the primary to the secondary
        run: |
          umask 077
          ssh -i ~/.ssh/deploy_key "$PRIMARY" 'grep -E "^MAIL_[A-Z0-9_]*=" /opt/gul/.env' < /dev/null > /tmp/mail.env
          grep -q '^MAIL_HOST=' /tmp/mail.env || { echo "primary has no MAIL_HOST -- refusing" >&2; exit 1; }
          scp -i ~/.ssh/deploy_key /tmp/mail.env "$SECONDARY:/tmp/mail.env"
          rm -f /tmp/mail.env
          ssh -i ~/.ssh/deploy_key "$SECONDARY" '
            set -e
            cd /opt/gul-secondary
            umask 077
            cp -p .env ".env.bak-mail-$(date +%Y%m%d%H%M%S)"
            { grep -vE "^MAIL_[A-Z0-9_]*=" .env; cat /tmp/mail.env; } > /tmp/env.new
            cat /tmp/env.new > .env   # keeps .env'"'"'s own owner and mode
            rm -f /tmp/env.new /tmp/mail.env
            echo "MAIL_* keys now: $(grep -cE "^MAIL_[A-Z0-9_]*=" .env)"' < /dev/null

      - name: Recreate the secondary's api and wait for health
        run: |
          ssh -i ~/.ssh/deploy_key "$SECONDARY" '
            cd /opt/gul-secondary
            for attempt in 1 2 3; do
              docker compose up -d --force-recreate --no-deps api && break
              sleep $((attempt * 10))
            done
            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:4000/api/health/ready > /dev/null && echo healthy && exit 0
              sleep 2
            done
            echo "api did NOT come back healthy" >&2; exit 1' < /dev/null

      - name: SMTP check on both nodes
        run: |
          for t in "$PRIMARY /opt/gul" "$SECONDARY /opt/gul-secondary"; do
            set -- $t
            echo "== ${2##*/}"
            scp -i ~/.ssh/deploy_key infra/checks/smtp-check.js "$1:/tmp/smtp-check.js"
            ssh -i ~/.ssh/deploy_key "$1" "cd $2 && docker compose exec -T api node - < /tmp/smtp-check.js; rc=\$?; rm -f /tmp/smtp-check.js; exit \$rc" || fail=1
          done
          exit ${fail:-0}

      - name: Fingerprints after (should now match)
        if: always()
        run: |
          fp='grep -E "^MAIL_[A-Z0-9_]*=" .env | sort | while IFS= read -r l; do printf "%s %s\n" "${l%%=*}" "$(printf %s "${l#*=}" | sha256sum | cut -c1-8)"; done'
          a=$(ssh -i ~/.ssh/deploy_key "$PRIMARY" "cd /opt/gul && $fp" < /dev/null)
          b=$(ssh -i ~/.ssh/deploy_key "$SECONDARY" "cd /opt/gul-secondary && $fp" < /dev/null)
          [ "$a" = "$b" ] && echo "MAIL_* identical on both hosts" || { echo "MAIL_* still differ" >&2; exit 1; }
          rm -f /tmp/fp-primary /tmp/fp-secondary
