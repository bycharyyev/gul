name: tmp mx com
on:
  workflow_dispatch:
jobs:
  mx:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.TIMEWEB_API_TOKEN }}
    steps:
      - name: Switch gulyaly.com mail to REG.RU hosting
        run: |
          set -e
          API=https://api.timeweb.cloud/api/v2/domains/gulyaly.com/dns-records
          LIST=$(curl -s "$API" -H "Authorization: Bearer $T")
          echo "$LIST" | cut -c1-300
          echo "$LIST" | jq -r '.dns_records[]|select(.type=="MX" or (.type=="TXT" and (.data.value|startswith("v=spf1"))))|"\(.id) \(.type) \(.data.value // .data.target)"'
          for id in $(echo "$LIST" | jq -r '.dns_records[]|select(.type=="MX" and (.data.value|test("timeweb")))|.id'); do
            curl -s -o /dev/null -w "delete $id -> %{http_code}\n" -X DELETE "$API/$id" -H "Authorization: Bearer $T"
          done
          SPF=$(echo "$LIST" | jq -r '.dns_records[]|select(.type=="TXT" and (.data.value|startswith("v=spf1")))|.id')
          curl -s -X PATCH "$API/$SPF" -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
            -d '{"type":"TXT","value":"v=spf1 include:_spf.timeweb.ru a:mail.gulyaly.com include:_spf.hosting.reg.ru a:sm41.hosting.reg.ru ~all"}' | cut -c1-200; echo
