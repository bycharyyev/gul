name: tmp mx com
on:
  workflow_dispatch:
jobs:
  mx:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.TIMEWEB_API_TOKEN }}
    steps:
      - name: Update apex SPF
        run: |
          curl -s -X PATCH "https://api.timeweb.cloud/api/v2/domains/gulyaly.com/dns-records/92919599" -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
            -d '{"type":"TXT","value":"v=spf1 include:_spf.timeweb.ru a:mail.gulyaly.com include:_spf.hosting.reg.ru a:sm41.hosting.reg.ru ~all"}' | cut -c1-220; echo
