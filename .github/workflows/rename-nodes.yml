name: Rename the three servers (one-off)

# One-off, approved in chat 2026-10-09: primary -> gul-a, secondary -> gul-b, witness -> gul-w.
# Changes only the system hostname (and /etc/hosts), then restarts netdata so the dashboard shows the
# new names. Cluster node names are set by the application config, not by the hostname.
# Deleted by the follow-up commit after it has run.

on:
  workflow_dispatch: {}

jobs:
  rename:
    runs-on: ubuntu-latest
    env:
      PA: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      PB: ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}
      PW: ${{ secrets.WITNESS_USER }}@${{ secrets.WITNESS_HOST }}
    steps:
      - name: Rename
        shell: bash {0}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/k && chmod 600 ~/.ssh/k
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          run_one() { # run_one <user@host> <new-name>
            printf '%s\n' \
              "old=\$(hostname)" \
              "hostnamectl set-hostname $2" \
              "sed -i \"s/\b\$old\b/$2/g\" /etc/hosts" \
              "grep -q \"$2\" /etc/hosts || echo \"127.0.1.1 $2\" >> /etc/hosts" \
              "systemctl restart netdata 2>/dev/null || true" \
              "echo \"renamed \$old -> \$(hostname)\"" > /tmp/rn.sh
            scp -q -i ~/.ssh/k /tmp/rn.sh "$1:/tmp/rn.sh"
            ssh -i ~/.ssh/k -o BatchMode=yes "$1" "docker run --rm --pid=host --uts=host --network=host --privileged -v /:/host alpine chroot /host /bin/sh /tmp/rn.sh; rm -f /tmp/rn.sh" < /dev/null
          }
          run_one "$PA" gul-a
          run_one "$PB" gul-b
          run_one "$PW" gul-w
