name: One-off - FreeKassa secret fingerprints

# Prints only the length and the first 8 hex of SHA-256 of each FreeKassa secret (whitespace
# trimmed, as the adapter does), to compare with the merchant panel without showing the values.
# Delete after use.

on:
  workflow_dispatch:

jobs:
  fp:
    runs-on: ubuntu-latest
    env:
      FREEKASSA_SHOP_ID: ${{ secrets.FREEKASSA_SHOP_ID }}
      FREEKASSA_SECRET_WORD_1: ${{ secrets.FREEKASSA_SECRET_WORD_1 }}
      FREEKASSA_SECRET_WORD_2: ${{ secrets.FREEKASSA_SECRET_WORD_2 }}
      FREEKASSA_API_KEY: ${{ secrets.FREEKASSA_API_KEY }}
    steps:
      - run: |
          for key in FREEKASSA_SHOP_ID FREEKASSA_API_KEY FREEKASSA_SECRET_WORD_1 FREEKASSA_SECRET_WORD_2; do
            v=$(printf '%s' "${!key}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            echo "$key len=${#v} fp=$(printf '%s' "$v" | sha256sum | cut -c1-8)"
          done
