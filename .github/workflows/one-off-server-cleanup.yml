name: One-off server cleanup (stop unused mail relay, remove dead cert-sync units)

# One-off, approved in chat on 2026-10-09. Deleted in the follow-up commit once it has run.
#  - secondary: stop and disable Postfix and OpenDKIM. Nothing in the repository sends through the local
#    relay any more (app mail and server alerts use REG.RU). Ports 25 and 587 stop listening.
#  - both nodes: stop, disable and delete the old gul-cert-sync units (the CI wildcard flow replaced them).
#  - both nodes: disable certbot.timer (certificates come from renew-certs.yml, not per host).
# Each node prints its state before and after; the job fails if 25 or 587 is still listening.

on:
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PA: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      PB: ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}
    steps:
      - name: Run on both nodes
        shell: bash {0}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/k && chmod 600 ~/.ssh/k
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf '%s\n' \
            'set -e' \
            "echo '--- before ---'" \
            'systemctl is-active postfix opendkim certbot.timer gul-cert-sync.timer 2>/dev/null || true' \
            "ss -tln | awk 'NR>1 {print \$4}' | grep -E ':(25|587)$' || echo 'no 25/587 listener'" \
            'systemctl disable --now postfix opendkim 2>/dev/null || true' \
            'systemctl disable --now certbot.timer 2>/dev/null || true' \
            'systemctl disable --now gul-cert-sync.timer gul-cert-sync.service 2>/dev/null || true' \
            'rm -f /etc/systemd/system/gul-cert-sync.timer /etc/systemd/system/gul-cert-sync.service' \
            'systemctl daemon-reload' \
            "echo '--- after ---'" \
            'systemctl is-active postfix opendkim certbot.timer gul-cert-sync.timer 2>/dev/null || true' \
            "if ss -tln | awk 'NR>1 {print \$4}' | grep -qE ':(25|587)\$'; then echo 'STILL LISTENING on 25/587' >&2; exit 1; fi" \
            'echo clean' > c.sh
          for t in "$PA" "$PB"; do
            echo "======== $t"
            scp -q -i ~/.ssh/k c.sh "$t:/tmp/c.sh"
            ssh -i ~/.ssh/k -o BatchMode=yes "$t" "docker run --rm --pid=host --network=host --privileged -v /:/host alpine chroot /host /bin/sh /tmp/c.sh; rc=\$?; rm -f /tmp/c.sh; exit \$rc" < /dev/null
          done
