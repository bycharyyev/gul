name: Fix -- Postfix wastes time on unreachable IPv6 before falling back to IPv4

# Secondary has no IPv6 default route, but Postfix's default inet_protocols = all makes it try
# IPv6 first on every outbound delivery, fail with "Network is unreachable", then retry via IPv4.
# Confirmed 2026-08-28: the 3b verification send took an extra failed attempt for exactly this
# reason before Gmail accepted it on IPv4. Pinning inet_protocols = ipv4 removes that wasted hop.
# Purely a delivery-speed fix -- inbound is unaffected (this relay doesn't receive mail, port 25 is
# firewalled shut).

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SECONDARY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Show before/after diff, apply, reload
        run: |
          cat > /tmp/fix-ipv4.sh <<'SCRIPT'
          set -e
          echo "--- main.cf inet_protocols line, before ---"
          grep -n '^inet_protocols' /etc/postfix/main.cf || echo "(not set, defaults to 'all')"
          cp /etc/postfix/main.cf /tmp/main.cf.before
          postconf -e 'inet_protocols = ipv4'
          echo "--- diff ---"
          diff -u /tmp/main.cf.before /etc/postfix/main.cf || true
          rm -f /tmp/main.cf.before
          echo "--- postfix check ---"
          postfix check
          echo "--- reloading ---"
          systemctl reload postfix
          sleep 1
          systemctl is-active postfix
          postconf inet_protocols
          SCRIPT
          scp -i ~/.ssh/id_ed25519 /tmp/fix-ipv4.sh ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}:/tmp/fix-ipv4.sh
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }} '
            docker run --rm --pid=host --privileged -v /:/host -v /tmp/fix-ipv4.sh:/host/tmp/fix-ipv4.sh alpine chroot /host /bin/bash /tmp/fix-ipv4.sh
            status=$?
            rm -f /tmp/fix-ipv4.sh
            exit $status
          ' < /dev/null
          rm -f /tmp/fix-ipv4.sh

      - name: Verify -- transactional and marketing mail still relay fine (health + queue check, no need to resend)
        run: |
          for i in $(seq 1 10); do
            curl -fsS -m 5 https://api.gulyaly.pro/api/health/ready > /dev/null && echo healthy && exit 0
            sleep 2
          done
          exit 1
