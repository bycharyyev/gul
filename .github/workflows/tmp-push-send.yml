name: tmp push send
on:
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      - name: Send a test push to every user that has a registered device (no token values printed)
        run: |
          cat > /tmp/send.sh <<'SCRIPT'
          cd /opt/gul
          docker compose exec -T api node -e "
            const { NestFactory } = require('@nestjs/core');
            const { AppModule } = require('./dist/src/app.module');
            const { PushCampaignService } = require('./dist/src/notifications/push-campaign.service');
            const { PrismaService } = require('./dist/src/prisma/prisma.service');
            (async () => {
              const app = await NestFactory.createApplicationContext(AppModule, { logger: ['error','warn'] });
              const prisma = app.get(PrismaService);
              const svc = app.get(PushCampaignService);
              const rows = await prisma.pushToken.findMany({ select: { userId: true } });
              const users = [...new Set(rows.map((r) => r.userId))];
              console.log('devices=' + rows.length + ' users=' + users.length);
              if (users.length !== 1) { console.log('ABORT: expected exactly one registered user, found ' + users.length); await app.close(); process.exit(0); }
              const admin = await prisma.user.findFirst({ where: { role: 'ADMIN' }, select: { id: true } });
              const me = await prisma.user.findUnique({ where: { id: users[0] }, select: { country: true, locale: true, phone: true } });
              console.log('recipient country=' + me.country + ' locale=' + me.locale);
              const campaign = await svc.createCampaign({
                name: 'Тест управления push',
                content: { category: 'gallery', titleRu: 'Тест из админки', bodyRu: 'Рассылка с сервера дошла. Нажмите, чтобы открыть Букеты.', titleEn: 'Admin test', bodyEn: 'Campaign delivered.', imageUrl: 'https://open.s3.regru.cloud/uploads/d9ad75f7-72dc-4bfc-97db-e10c2847b166.png', route: '/gallery' },
                audience: { type: 'USERS', userIds: [users[0]] },
                sendNow: true,
              }, admin.id);
              console.log('campaign=' + campaign.id + ' status=' + campaign.status);
              await new Promise((r) => setTimeout(r, 6000));
              console.log('stats ' + JSON.stringify((await svc.getCampaign(campaign.id)).stats));
              await app.close();
              process.exit(0);
            })().catch((e) => { console.error('ERR ' + String(e).slice(0, 300)); process.exit(1); });
          " < /dev/null
          SCRIPT
          scp -i ~/.ssh/k /tmp/send.sh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/send.sh
          ssh -i ~/.ssh/k ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash /tmp/send.sh; rm -f /tmp/send.sh' < /dev/null || true
