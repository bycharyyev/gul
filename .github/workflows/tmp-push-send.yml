name: tmp push send
on:
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      - name: Send a test push to every user that has a registered device (no token values printed)
        run: |
          cat > /tmp/send.sh <<'SCRIPT'
          cd /opt/gul
          docker compose exec -T api node -e "
            const { NestFactory } = require('@nestjs/core');
            const { AppModule } = require('./dist/src/app.module');
            const { PushCampaignService } = require('./dist/src/notifications/push-campaign.service');
            const { PrismaService } = require('./dist/src/prisma/prisma.service');
            (async () => {
              const app = await NestFactory.createApplicationContext(AppModule, { logger: ['error','warn'] });
              const prisma = app.get(PrismaService);
              const svc = app.get(PushCampaignService);
              const rows = await prisma.pushToken.findMany({ select: { userId: true } });
              const users = [...new Set(rows.map((r) => r.userId))];
              console.log('devices=' + rows.length + ' users=' + users.length);
                            const list = await svc.listCampaigns(3);
              for (const c of list) console.log('campaign ' + c.name + ' ' + c.status + ' ' + JSON.stringify(c.stats));
              const detail = await svc.getCampaign(list[0].id);
              console.log('by country ' + JSON.stringify(detail.byCountry));
              const overview = await svc.overview(7);
              console.log('overview ' + JSON.stringify(overview.totals) + ' ' + JSON.stringify(overview.byCategory));
              await app.close();
              process.exit(0);
            })().catch((e) => { console.error('ERR ' + String(e).slice(0, 300)); process.exit(1); });
          " < /dev/null
          SCRIPT
          scp -i ~/.ssh/k /tmp/send.sh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/send.sh
          ssh -i ~/.ssh/k ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash /tmp/send.sh; rm -f /tmp/send.sh' < /dev/null || true
