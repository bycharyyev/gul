name: Smoke timeout diagnostics (read-only, one-off)

# One-off: why did smoke (primary) in deploy run 43734809882 get no answer from several API routes
# between 16:28 and 16:31 UTC on 2026-11-15, right after api/api-2 were recreated?
# Reads nginx logs, API container logs, firewall and kernel messages for that window. Changes
# nothing. Delete after reading.

on:
  workflow_dispatch:
    inputs:
      since:
        default: '2026-11-15T16:26:00Z'
      until:
        default: '2026-11-15T16:33:00Z'

jobs:
  read:
    runs-on: ubuntu-latest
    env:
      PA: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      SINCE: ${{ inputs.since }}
      UNTIL: ${{ inputs.until }}
    steps:
      - name: Read
        shell: bash {0}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/k && chmod 600 ~/.ssh/k
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          # Host-side part, run as root through the docker-chroot trick. Built with echo lines.
          {
            echo 'echo "== nginx error.log, 15 Nov 17:2x-17:3x local (UTC+1)"'
            echo 'grep -hE "2026/11/15 17:(2[6-9]|3[0-3])" /var/log/nginx/error.log /var/log/nginx/error.log.1 2>/dev/null | tail -60'
            echo 'echo "== nginx access.log, api requests 15/Nov 17:2x-17:3x local (UTC+1) (no query strings)"'
            echo 'zgrep -hE "15/Nov/2026:17:(2[7-9]|3[0-2])" /var/log/nginx/access.log /var/log/nginx/access.log.1 /var/log/nginx/access.log.*.gz 2>/dev/null | grep -vE ".env|/proc/" | sed -E "s/\?[^ \"]*//; s/([0-9]+\.[0-9]+\.[0-9]+\.)[0-9]+/\1x/" | tail -200'
            echo 'echo "== ufw"'
            echo 'ufw status verbose 2>&1 | sed -E "s/([0-9]+\.[0-9]+\.[0-9]+\.)[0-9]+/\1x/g" | head -40'
            echo 'echo "== fail2ban"'
            echo 'command -v fail2ban-client >/dev/null && fail2ban-client status 2>&1 | head -10 || echo "not installed"'
            echo 'echo "== iptables rules mentioning limit/recent/443"'
            echo 'iptables -S 2>/dev/null | grep -iE "limit|recent|443|hashlimit|connlimit" | sed -E "s/([0-9]+\.[0-9]+\.[0-9]+\.)[0-9]+/\1x/g" | head -30'
            echo 'echo "== kernel log in the window"'
            echo 'journalctl -k --since "2026-11-15 17:26" --until "2026-11-15 17:33" --no-pager 2>/dev/null | sed -E "s/([0-9]+\.[0-9]+\.[0-9]+\.)[0-9]+/\1x/g" | tail -40'
            echo 'echo "== uptime / load"'
            echo 'uptime'
          } > diag.sh
          scp -q -i ~/.ssh/k diag.sh "$PA:/tmp/smoke-diag.sh"
          ssh -i ~/.ssh/k -o BatchMode=yes "$PA" "docker run --rm --pid=host --network=host --privileged -v /:/host alpine chroot /host /bin/sh /tmp/smoke-diag.sh; rm -f /tmp/smoke-diag.sh" < /dev/null

          echo "== containers (started at)"
          ssh -i ~/.ssh/k -o BatchMode=yes "$PA" "docker ps --format '{{.Names}} {{.Status}} {{.RunningFor}}'; for c in gul-api-1 gul-api-2-1 gul-postgres-1 gul-redis-1; do echo \"\$c started \$(docker inspect -f '{{.State.StartedAt}}' \$c 2>/dev/null) restarts \$(docker inspect -f '{{.RestartCount}}' \$c 2>/dev/null)\"; done" < /dev/null

          for c in gul-api-1 gul-api-2-1 gul-postgres-1 gul-redis-1; do
            echo "===== $c log $SINCE .. $UNTIL"
            ssh -i ~/.ssh/k -o BatchMode=yes "$PA" "docker logs --since $SINCE --until $UNTIL $c 2>&1 | grep -viE 'password|secret|token|authorization|key=' | tail -80" < /dev/null
          done
