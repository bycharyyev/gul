name: Set Heleket credentials on both hosts

# Writes HELEKET_MERCHANT_ID and HELEKET_API_KEY (the *payment* API key from the Heleket account)
# from the repository secrets of the same names into /opt/gul/.env and /opt/gul-secondary/.env,
# then recreates the three API processes on each host one at a time. The Heleket adapter registers
# itself only when both are present (ADR-0005), so this is what makes the provider exist.
#
# The values never reach a log: they go into a 0600 file on the runner, are copied to each host
# and merged there, and only key names are printed. Re-run after rotating the key in Heleket.

on:
  workflow_dispatch:

jobs:
  set:
    runs-on: ubuntu-latest
    env:
      PRIMARY: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      SECONDARY: ${{ secrets.SECONDARY_USER }}@${{ secrets.SECONDARY_HOST }}
      HELEKET_MERCHANT_ID: ${{ secrets.HELEKET_MERCHANT_ID }}
      HELEKET_API_KEY: ${{ secrets.HELEKET_API_KEY }}
    steps:
      - name: Set up SSH (pinned host keys)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Build the env fragment (refuses missing or unsafe values)
        run: |
          umask 077
          : > /tmp/hk.env
          for key in HELEKET_MERCHANT_ID HELEKET_API_KEY; do
            value="${!key}"
            [ -n "$value" ] || { echo "repository secret $key is not set" >&2; exit 1; }
            # Written single-quoted for the shell-like .env; a quote or newline could not be.
            case "$value" in *"'"*|*$'\n'*) echo "$key contains a quote or newline; regenerate it" >&2; exit 1;; esac
            printf "%s='%s'\n" "$key" "$value" >> /tmp/hk.env
          done
          [[ "$HELEKET_MERCHANT_ID" =~ ^[0-9a-fA-F-]{8,}$ ]] || { echo "HELEKET_MERCHANT_ID must be the merchant UUID" >&2; exit 1; }
          echo "keys: $(cut -d= -f1 /tmp/hk.env | tr '\n' ' ')"

      - name: Write to both hosts and recreate the API processes
        run: |
          apply() {
            scp -i ~/.ssh/deploy_key /tmp/hk.env "$1:/tmp/hk.env"
            ssh -i ~/.ssh/deploy_key "$1" '
              set -e
              cd '"$2"'
              umask 077
              cp -p .env ".env.bak-heleket-$(date +%Y%m%d%H%M%S)"
              { grep -vE "^HELEKET_(MERCHANT_ID|API_KEY)=" .env; cat /tmp/hk.env; } > /tmp/env.new
              cat /tmp/env.new > .env
              rm -f /tmp/env.new /tmp/hk.env
              # One process at a time (worker, api, api-2), as the deploy does: one HTTP process is
              # always serving, and a host that is briefly short of Postgres or Redis cannot take
              # all three down at once (2026-10-02, recreating all three together did exactly that).
              for pair in api-worker:4001 api:4000 api-2:4002; do
                svc=${pair%%:*}; port=${pair##*:}
                for attempt in 1 2 3; do
                  docker compose up -d --force-recreate --no-deps "$svc" && break
                  sleep $((attempt * 10))
                done
                ok=0
                for i in $(seq 1 45); do
                  curl -fsS "http://127.0.0.1:$port/api/health/ready" > /dev/null && { ok=1; break; }
                  sleep 2
                done
                [ "$ok" = 1 ] || { echo "$svc (port $port) did not come back healthy" >&2; exit 1; }
              done
              echo "healthy: '"$2"'"' < /dev/null
          }
          apply "$PRIMARY" /opt/gul
          apply "$SECONDARY" /opt/gul-secondary
          rm -f /tmp/hk.env

      - name: The provider now answers (an unsigned probe must be refused, not "unknown provider")
        run: |
          for ip in "${{ secrets.DEPLOY_HOST }}" "${{ secrets.SECONDARY_HOST }}"; do
            body=$(curl -s --resolve "api.gulyaly.com:443:$ip" -X POST \
              -H "Content-Type: application/json" -d '{"probe":1}' \
              https://api.gulyaly.com/api/payments/webhooks/heleket)
            echo "$body" | grep -q "Unknown payment provider" && { echo "Heleket is not registered on a node" >&2; exit 1; }
            echo "node answers: $(echo "$body" | head -c 120)"
          done
