packages:
  - "apps/*"
  - "packages/*"
overrides:
  multer: ">=2.2.0"
  lodash: ">=4.17.24"
  postcss: ">=8.5.23"
  # Security floors (pnpm audit --prod, 2026-10-01). Caret, not >=: a bare >= lets pnpm resolve the
  # next major (js-yaml 5, fast-uri 4) under packages that were never tested against it.
  js-yaml: "^4.3.2"
  fast-uri: "^3.1.7"
  brace-expansion@^2: "^2.1.7"
  brace-expansion@^5: "^5.0.12"
  qs: ">=6.16.0"
  file-type: ">=21.3.2"
  deepmerge-ts: ">=8.0.0"
  sharp: ">=0.35.5"
  body-parser: ">=1.20.6"
  # Advisories open on main (pnpm audit --prod, 2026-10-09). proxy-addr is critical: IP spoofing
  # through the trust-proxy hop, and ThrottlerGuard (login brute-force limit) keys on req.ip.
  proxy-addr: ">=2.0.8"
  source-map-js: ">=1.2.2"
  uuid: ">=11.1.1"
  webpack: ">=5.104.1"
allowBuilds:
  '@firebase/util': false
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@sentry/cli': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: false
  sharp: true
  unrs-resolver: true
