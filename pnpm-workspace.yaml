packages:
  - "apps/*"
  - "packages/*"
overrides:
  multer: ">=2.2.0"
  lodash: ">=4.17.24"
  postcss: ">=8.5.23"
  # Security floors (pnpm audit --prod, 2026-10-01). Caret, not >=: a bare >= lets pnpm resolve the
  # next major (js-yaml 5, fast-uri 4) under packages that were never tested against it.
  js-yaml: "^4.3.2"
  fast-uri: "^3.1.7"
  brace-expansion@^2: "^2.1.7"
  brace-expansion@^5: "^5.0.12"
  qs: ">=6.15.2"
  file-type: ">=21.3.2"
  deepmerge-ts: ">=8.0.0"
  sharp: ">=0.35.0"
  body-parser: ">=1.20.6"
allowBuilds:
  '@firebase/util': false
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@sentry/cli': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: false
  sharp: true
  unrs-resolver: true
